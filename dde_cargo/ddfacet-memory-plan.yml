# GENERATED by tools/build-memplan-cabs.py from cabs/ddfacet-memory-plan.yml.in, tools/memplan_lib.py and
# memplan-model.json (and the image pins of pyproject.toml).  DO NOT EDIT THIS FILE: edit the template or the
# sources and run tools/build-memplan-cabs.py.  `--check` fails when this file is stale.
#
# stimela cab: ddfacet-memory-plan
#
# Chooses --Parallel-NCPU, --Data-ChunkHours and (only when it has to) --Selection-ChanStep for a DDFacet run, from
# the geometry that run will use, the MS, and a memory budget.  It replaces upstream's DDFacet/ToolsDir/
# ModEstimateMemory.py planner, whose threaded model under-predicted the fast profile 6-10x; THIS file is now the
# planner (the copy in the DDFacet package is stale, and the old "copied verbatim from the package" note is gone).
#
# THE MODEL (form D, design section 6)
#   peak = a + c1a*S + c1b*(NBand-1)*S + c3*rows_chunk*nchan*16e-9 + c4b*BeamNBand*NA*nfacets*8e-9
#            + c4c*[corrected]*NA*nfacets*nchan*8e-9 + {SSD2, SSD3 add-on} + {target, finalize, corrected offset}
#   S = sum over facets of NpixFacetPadded^2 * 16e-9      peak = max RSS of the DDF.py process, GB = 1e9 B
#   The beam term has no channel axis (cubes per beam band) except in the corrected pass, which carries a per-channel,
#   per-facet term (X4c).  `initial` is the baseline; `target` is the ddfacet-target Clean on grid facets.  Pure
#   Output-Mode Dirty is not a pipeline step and is not modelled.
#   Flat in NCPU: the rayon line's workers are threads in one process (measured 13.2 / 13.6 / 13.8 GB at NCPU 4 /
#   12 / 20), so NCPU is not a memory knob: the plan returns every usable core (or WantNCPU) and searches memory
#   over ChunkHours and ChanStep only.
#   The coefficients are edited in memplan-model.json (repo root), the single source of truth, and INLINED into this
#   file by tools/build-memplan-cabs.py (see SELF-CONTAINED below); it is written by `tools/memplan-fit.py RUNS.TSV [RUNS.TSV ...] --write-model memplan-model.json` (a joint fit on the
#   spark points and the x86 #63 points).  Calibration of 2026-10-18: phase 1 (fast profile) and phase 2 / 2b (real
#   profile), spark (arm64, 20 cores): runs around the base point (NPix, facets, Padding, NBand, beam, ChanStep,
#   ChunkHours, mode, step type, NCPU, t0 vs t1); accepted by leave-one-configuration-out (see the fit output).
#   Design, data and acceptance bands: research/MEMORY_PLAN_CALIBRATION.md.  To refit: add runs
#   (tools/memplan-sweep.sh), rerun memplan-fit.py with --write-model (which regenerates this cab), commit the JSON and the cab.
#
# THE FACET GEOMETRY (the term that matters)
#   S and nfacets come from the tessellation DDFacet will actually build, computed BEFORE it runs: tools/
#   memplan_lib.py calls DDFacet's own ClassFacetMachine.appendMainField / ClassFacetMachineTessel.setFacetsLocs on
#   a facet machine with a stub VisServer that carries only the phase centre (read from the MS FIELD table), with
#   NPix, Cell, Padding, DiamMax/DiamMin, NFacets, CatNodes and CatCentres.  Validated on the 32 phase-1 runs (checked again on the real profile): facet
#   count and sum NpixFacetPadded^2 are EXACT on all 32 (B 192 facets, D2-diam1.0 28, D2-diam0.15 620, D2-nocat 144,
#   corrected 134, NPix 4459, t0 199, ...), and so is the rows-per-chunk figure (it follows ClassMS's chunking rule
#   over the MS TIME column).  No visibilities are read.  CatNodes must be the file the run will use: if it does not
#   exist yet (a fresh observation, before the clustering step) the plan falls back to the NFacets grid, or to
#   NDirections synthetic directions (within ~15 % of a real ClusterCat's facet area, the grid is 25-35 % low), and says so;
#   put the plan step AFTER the step that writes it (white-belt-4-ddfacet.yml does).
#
# SELF-CONTAINED (this cab ships in the dde-cargo package, so it reads no host file)
#   The cab code carries tools/memplan_lib.py and memplan-model.json inlined into its python-code command (a source
#   string exec'd into a module, and the model JSON), so it works from a pip install, from any working directory, in
#   the DDFacet image, with no `Lib` / `ModelFile` inputs.  tools/build-memplan-cabs.py generates the cab from this
#   template; `tools/build-memplan-cabs.py --check` (and tests/test_memplan_cabs.py, tools/check-pins.py) fail when the
#   generated file is stale against its sources.
#
# WIRING (white-belt-4-ddfacet.yml): one plan before the first, grid-faceted imaging step, and a second after the
# ClusterCat exists for the clean / finalize / corrected steps:
#
#     ddfacet-memory-plan:
#         cab: ddfacet-memory-plan
#         params:
#             MS: =recipe.target-ms
#             NPix: =steps.estimate-npix.NPixOut
#             Cell: =recipe.pixel-scale
#             CatNodes: '{recipe.ddf-img-prefix}.ClusterCat.npy'
#             Mode: HMP
#             Step: target          # clustered, for the passes that have the ClusterCat
#     inital-masked-deconvolution:
#         params:
#             Parallel.NCPU: =steps.ddfacet-memory-plan.NCPU
#             Data.ChunkHours: =steps.ddfacet-memory-plan.ChunkHours
#             Selection.ChanStep: =steps.ddfacet-memory-plan.ChanStep
#
#   `=steps.<plan>.X` references work only when the plan step is in the same stimela selection (-s) as its consumer.
#   MemWatermarkGB is no longer an output: Parallel.MemWatermarkGB has had no effect since DDFacet#80 (v0.16.0), so
#   nothing is left to wire.
#
# STEP: target (ddfacet-target, grid facets), initial, finalize, corrected, or clustered = the largest of initial /
# finalize / corrected, each on its own tessellation (corrected with CatCentres when given).  On the real profile
# corrected is the peak (33.5 GB against 26 GB for initial); on the fast profile initial is.
#
# SEARCH: NCPU = every usable core (or WantNCPU).  ChunkHours = the largest of {4, 2, 1, 0.5} whose predicted peak
# x Margin fits RamGB at ChanStep 1.  Only if none fits is ChanStep raised (Prefer: fidelity = the smallest ChanStep
# that lets some chunk fit; speed = the largest chunk wins even if it costs band).  Margin (default 1.25) is a
# safety factor on the prediction; the calibration's worst in-band error was -17 %.  RamGB and WantNCPU default to
# what the host offers when the step runs (MemAvailable capped by a cgroup limit; the CPU affinity set).
# A plan with ChanStep > 1 prints a WARNING and lists it under `warnings` in the plan JSON: --Selection-ChanStep N
# selects every Nth channel and DISCARDS (N-1)/N of the data.  (Behaviour is otherwise unchanged.)
# Exit status: nonzero when nothing fits, with the plan JSON written.
#
# History: v0.10 vendored the package cab; v0.12 added the threaded (flat-NCPU) planning of 2026-09-27; the model
# was recalibrated on 2026-10-18 and moved here, out of DDFacet.

vars:
  ddfacet-memory-plan:
    image:
      registry: ghcr.io/tmolteno
      name: ddfacet
      # The planner runs DDFacet's tessellation, so pin it to the imaging pin (tools/check-pins.py).
      version: v0.16.10

cabs:
    ddfacet-memory-plan:
        info: |
            Choose --Parallel-NCPU, --Data-ChunkHours and (if the band must give) --Selection-ChanStep for a DDFacet
            run: the calibrated peak-memory model (memplan-model.json) evaluated on the run's real facet tessellation.
        image:
            _use: vars.ddfacet-memory-plan.image
        inputs:
            MS:
                dtype: MS
                required: true
                info: the MS the run images; read for rows, time span, channels, antennas and the phase centre only
            Field:
                dtype: int
                default: 0
                info: the MS field (Selection.Field)
            Parset:
                dtype: File
                required: false
                info: >
                    a parset whose options are the starting point (e.g. the parset_out of an earlier step).  Optional:
                    DDFacet's defaults are used otherwise.  The inputs below override whatever it says.
            NPix:
                dtype: int
                required: false
                info: Image.NPix
            Cell:
                dtype: float
                required: false
                info: Image.Cell, arcsec
            Padding:
                dtype: float
                required: false
                info: Facets.Padding
            DiamMax:
                dtype: float
                required: false
                info: Facets.DiamMax, deg
            DiamMin:
                dtype: float
                required: false
                info: Facets.DiamMin, deg
            NFacets:
                dtype: int
                required: false
                info: Facets.NFacets (the node grid when there is no CatNodes)
            CatNodes:
                dtype: File
                required: false
                must_exist: false
                info: >
                    Facets.CatNodes, the ClusterCat the run will use.  Need not exist yet: if absent the NFacets grid
                    is planned and the plan says so
            CatCentres:
                dtype: File
                required: false
                must_exist: false
                info: Facets.CatCentres (auto-facet centres), when the run uses them
            NDirections:
                dtype: int
                default: 0
                info: >
                    when there is no CatNodes (none given, or not written yet): plan around this many synthetic DD
                    directions on a sunflower disc (as plan-uvmax does) instead of the NFacets grid, which
                    under-counts a clustered run's facets by 25-35 %.  0 = the grid, which is right for a run that
                    really has no CatNodes
            NBand:
                dtype: int
                required: false
                info: Freq.NBand
            BeamModel:
                dtype: str
                required: false
                info: Beam.Model (None or any beam model; None switches the beam term off)
            BeamNBand:
                dtype: int
                required: false
                info: Beam.NBand
            Mode:
                dtype: str
                required: false
                choices: [HMP, SSD2, SSD3]
                info: "Deconv.Mode; default is the parset's, else DDFacet's default (HMP)"
            Step:
                dtype: str
                default: initial
                choices: [target, initial, finalize, corrected, clustered]
                info: >
                    which pass is being planned: target = ddfacet-target (a Clean on grid facets); clustered = the
                    largest of initial / finalize / corrected, the safe choice for a plan shared by those passes
            RamGB:
                dtype: float
                required: false
                info: >
                    memory the run may use, GB.  Default: what the host has available when the step runs --
                    MemAvailable, capped by the cgroup memory limit if there is one
            WantNCPU:
                dtype: int
                required: false
                info: >
                    worker count you would like; also the cap.  Default: the usable cores (the CPU affinity set, so a
                    taskset/cpuset is respected)
            Margin:
                dtype: float
                default: 1.25
                info: safety factor on the predicted peak before it is compared with RamGB
            Prefer:
                dtype: str
                default: fidelity
                choices: [fidelity, speed]
                info: "'fidelity' keeps the full band while any chunk length fits; 'speed' takes the largest chunk first and subsamples the band if it must"
            PlanOut:
                dtype: File
                default: ddfacet-memory-plan.json
                # the command *writes* this file, so stimela must not require it
                # to exist before the step starts (DDFacet#17)
                must_exist: false
                info: where to write the plan, as JSON
        outputs:
            NCPU:
                dtype: int
                info: pass to --Parallel-NCPU
            ChunkHours:
                dtype: float
                info: pass to --Data-ChunkHours
            ChanStep:
                dtype: int
                info: pass to --Selection-ChanStep
            PeakGB:
                dtype: float
                info: predicted max RSS of the DDF.py process at those settings, GB (1e9 B), without Margin
            PlannedGB:
                dtype: float
                info: PeakGB x Margin, the figure that was compared with the budget
            RamGBUsed:
                dtype: float
                info: the budget the plan was made for (RamGB, or what the host offered)
            NFacetsPlanned:
                dtype: int
                info: facets in the tessellation the prediction used
            Flags:
                dtype: str
                info: the flags, ready to paste
            Plan:
                dtype: File
                must_exist: false
                info: the JSON plan (chosen settings, the model's terms, every combination tried, notes)
        flavour:
            kind: python-code
        command: |
            import json
            import os

            # Optional inputs may arrive unset, in which case stimela does not
            # necessarily define the name at all -- look them up defensively.
            _g = globals()


            def _opt(name, default=None):
                value = _g.get(name, default)
                return default if value is None else value


            # ---- inlined by tools/build-memplan-cabs.py: tools/memplan_lib.py and memplan-model.json (no host file) ----
            import types
            _LIB_SOURCE = r'''"""Memory-plan library: the calibrated peak-memory models and the facet tessellation they need.

            Used by cabs/ddfacet-memory-plan.yml and cabs/killms-memory-plan.yml, which carry it INLINED (generated by
            tools/build-memplan-cabs.py; edit this file, not the cabs), and by cabs/plan-uvmax.yml, a local pipeline-specific cab that
            loads it through a `File` input (`Lib`, default tools/memplan_lib.py); it is not a package.  The coefficients are NOT here: they are in memplan-model.json, written by `tools/memplan-fit.py
            --write-model`, so a refit only regenerates that file.  Design and data: research/MEMORY_PLAN_CALIBRATION.md.

            The DDFacet part needs the DDFacet image (it runs DDFacet's own tessellation); the kMS part needs only numpy and
            casacore.  Nothing here reads visibilities: the MS is read for its row/time/channel/antenna counts and phase centre.
            """
            import contextlib
            import io
            import json
            import math
            import os
            import shutil
            import tempfile

            import numpy as np

            ONE_GIB = float(1 << 30)


            # ------------------------------------------------------------------ the host
            def usable_cores():
                try:
                    return len(os.sched_getaffinity(0))
                except AttributeError:
                    return os.cpu_count() or 1


            def available_gb():
                """MemAvailable capped by the cgroup (v2) limit, in GiB: what this run can use.  (RamGB inputs are GiB-ish
                budgets, as before; the model's GB are 1e9 B, so the model is slightly pessimistic against a GiB budget.)"""
                avail = None
                with open("/proc/meminfo") as fh:
                    for line in fh:
                        if line.startswith("MemAvailable:"):
                            avail = int(line.split()[1]) * 1024
                try:
                    cg = open("/proc/self/cgroup").read().strip().split("::", 1)[-1]
                    d = "/sys/fs/cgroup" + cg
                    mx = open(d + "/memory.max").read().strip()
                    if mx != "max":
                        free = int(mx) - int(open(d + "/memory.current").read())
                        avail = free if avail is None else min(avail, free)
                except (OSError, ValueError):
                    pass
                return avail / ONE_GIB


            # ------------------------------------------------------------------ the model file
            def load_model(path):
                with open(path) as fh:
                    return load_model_text(fh.read(), path)


            def load_model_text(text, label="memplan-model.json"):
                """The same, from the JSON text (the memory-plan cabs carry it inlined: tools/build-memplan-cabs.py)."""
                m = json.loads(text)
                path = label
                for kind in ("ddf", "kms"):
                    if kind not in m or "coefficients" not in m[kind]:
                        raise RuntimeError("memory model %s has no '%s' coefficients (regenerate it: tools/memplan-fit.py "
                                           "--write-model)" % (path, kind))
                return m


            def model_banner(m):
                return "model %s: fitted %s on %d DDF / %d kMS points (%s)" % (
                    m.get("schema", "?"), m.get("fitted", "?"), m["ddf"].get("npoints", 0), m["kms"].get("npoints", 0),
                    m.get("metric", "?"))


            # ------------------------------------------------------------------ the MS
            def ms_info(ms, field=0, ddid=0):
                """What the models need from an MS, read from the tables (no visibilities): rows, TIME column, channels,
                antennas and the field's phase centre."""
                from casacore.tables import table
                t = table(ms, ack=False, readonly=True)
                try:
                    fid, did = t.getcol("FIELD_ID"), t.getcol("DATA_DESC_ID")
                    sel = (fid == field) & (did == ddid)
                    times = t.getcol("TIME")[sel]
                    nrows_all = t.nrows()
                finally:
                    t.close()
                spw_id = int(table(ms + "::DATA_DESCRIPTION", ack=False).getcol("SPECTRAL_WINDOW_ID")[ddid])
                spw = table(ms + "::SPECTRAL_WINDOW", ack=False)
                nchan = int(len(spw.getcol("CHAN_FREQ")[spw_id]))
                spw.close()
                na = table(ms + "::ANTENNA", ack=False)
                nant = na.nrows()
                na.close()
                fld = table(ms + "::FIELD", ack=False)
                ra, dec = (float(x) for x in fld.getcol("PHASE_DIR")[field][0])
                fld.close()
                if ra < 0:
                    ra += 2 * math.pi
                return dict(nrows=int(sel.sum()), nrows_ms=int(nrows_all), times=times, nchan=nchan, nant=int(nant),
                            ra=ra, dec=dec, hours=float((times.max() - times.min()) / 3600.0) if len(times) else 0.0)


            def chunk_rows(times, chunk_hours):
                """Rows in the largest Data.ChunkHours chunk, with DDFacet's own rule (ClassMS: chunk starts at
                arange(T0, T1, hours*3600), each at the first row with TIME >= start).  chunk_hours 0/None = one chunk."""
                n = len(times)
                if not chunk_hours or n == 0:
                    return n
                t0, t1 = times[0], times[-1]
                starts = np.arange(t0, t1, chunk_hours * 3600.0)
                row0 = sorted(set(int(np.argmax(times >= s)) for s in starts)) + [n]
                return int(max(b - a for a, b in zip(row0[:-1], row0[1:])))


            def nchan_selected(nchan_ms, chan_start=0, chan_end=-1, chan_step=1):
                end = nchan_ms if chan_end is None or chan_end < 0 else min(int(chan_end), nchan_ms)
                return max(1, len(range(int(chan_start or 0), end, max(1, int(chan_step)))))


            # ------------------------------------------------------------------ the DDFacet geometry
            def ddf_gd(parset=None):
                """DDFacet's option dict (all sections, defaults filled in) from a parset, or the defaults alone."""
                from DDFacet.Parset import ReadCFG
                if parset:
                    return ReadCFG.Parset(parset).value_dict
                here = os.path.dirname(ReadCFG.__file__)
                return ReadCFG.Parset(os.path.join(here, "DefaultParset.cfg")).value_dict


            def set_gd(GD, **sections):
                """set_gd(GD, Image=dict(NPix=..), Facets=dict(...)): override options in place, creating nothing new."""
                for sec, opts in sections.items():
                    for k, v in opts.items():
                        if v is not None:
                            GD[sec][k] = v
                return GD


            class _MSStub:
                def __init__(self, ra, dec, name):
                    self.radec, self.MSName = (ra, dec), name


            class _VSStub:
                """The little of a VisServer that ClassFacetMachine.appendMainField reads."""
                def __init__(self, ra, dec, msname, nband):
                    self.ListMS = [_MSStub(ra, dec, msname)]
                    self.GlobalFreqs = np.linspace(1.0e9, 2.0e9, max(1, nband))
                    self.NFreqBands = max(1, nband)


            def _write_proxy_nodes(GD, ra, dec, n, path, frac=0.7):
                """n DD directions on a sunflower (Fermat spiral) disc of radius frac * the image half-width, as a CatNodes npy.
                A stand-in for the flux-clustered ClusterCat that does not exist yet when plan-uvmax runs (stage 0).  Against the
                real ClusterCats of the fast and real profiles (10 nodes, DiamMax 0.3, Padding 3) its sum NpixFacetPadded^2 is
                within +0.9 / +3.6 / +14 / +0.9 % (frac 0.7), where the NFacets=4 grid is 25-35 % low."""
                from DDFacet.ToolsDir import ModCoord
                from DDFacet.ToolsDir.ModToolBox import EstimateNpix
                npix = EstimateNpix(float(GD["Image"]["NPix"]), Padding=1)[0]
                half = GD["Image"]["Cell"] / 3600.0 * math.pi / 180.0 * npix / 2.0
                k = np.arange(n) + 0.5
                r, th = frac * half * np.sqrt(k / n), k * math.pi * (3 - math.sqrt(5))
                ra_n, dec_n = ModCoord.ClassCoordConv(ra, dec).lm2radec(r * np.cos(th), r * np.sin(th))
                cat = np.zeros(n, dtype=[("ra", float), ("dec", float)])
                cat["ra"], cat["dec"] = ra_n, dec_n
                np.save(path, cat)


            def tessellate(GD, ra, dec, msname="stub.ms", proxy_nodes=0, dico_out=None):
                """The facets DDFacet will build: runs ClassFacetMachineTessel.appendMainField (-> setFacetsLocs, AppendFacet)
                itself, on a facet machine whose __init__ is skipped and whose VisServer is a stub carrying the phase centre.
                Needs GD["Image"]["NPix"/"Cell"], ["Facets"]["Padding"/"DiamMax"/"DiamMin"/"NFacets"/"CatNodes"/"CatCentres"].
                proxy_nodes=N (when GD has no CatNodes): tessellate around N synthetic directions instead of the NFacets grid
                (see _write_proxy_nodes).  Returns (nfacets, sum NpixFacetPadded^2, list of padded sizes); dico_out=PATH also pickles the DicoImager there.  Writes its
                .reg/.npy/.DicoFacet side files to a temp dir, and drops DDSols (the nodes then come from CatNodes or the NFacets grid, as for a first imaging pass)."""
                from DDFacet.Imager.ClassFacetMachineTessel import ClassFacetMachineTessel
                from DDFacet.Imager.ClassFacetMachine import ClassFacetMachine
                import copy
                gd = copy.deepcopy(GD)
                tmp = tempfile.mkdtemp(prefix="memplan-tess-")
                cwd = os.getcwd()
                for k in ("CatNodes", "CatCentres"):          # resolve before the chdir below (the recipe passes cwd-relative paths)
                    v = gd["Facets"].get(k)
                    if isinstance(v, str) and v and v.lower() != "none" and not os.path.isabs(v):
                        gd["Facets"][k] = os.path.join(cwd, v)
                try:
                    os.chdir(tmp)                            # DDFacet drops debug .npz files in the cwd on odd polygons
                    gd["Output"]["Name"] = os.path.join(tmp, "out")
                    gd["DDESolutions"]["DDSols"] = ""
                    if proxy_nodes and not gd["Facets"].get("CatNodes"):
                        gd["Facets"]["CatNodes"] = os.path.join(tmp, "proxy.ClusterCat.npy")
                        _write_proxy_nodes(gd, ra, dec, int(proxy_nodes), gd["Facets"]["CatNodes"])
                    fm = object.__new__(ClassFacetMachineTessel)
                    fm.GD, fm.VS = gd, _VSStub(ra, dec, msname, int(gd["Freq"]["NBand"]))
                    fm.npol, fm.DoPSF, fm.DoDDE, fm.Oversize = 1, False, False, 1
                    fm.DicoGridMachine = {}                 # what __del__ looks for
                    try:
                        from DDFacet.Other import logger
                        logger.setSilent(["ClassFacetMachineTessel", "ClassFacetMachine", "VoronoiToReg"])
                    except Exception:                       # chatter only
                        pass
                    sink = io.StringIO()
                    with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                        ClassFacetMachine.appendMainField(fm, Npix=gd["Image"]["NPix"], Cell=gd["Image"]["Cell"],
                                                          NFacets=int(gd["Facets"]["NFacets"]),
                                                          ImageName=os.path.join(tmp, "out"))
                    pads = [int(v["NpixFacetPadded"]) for v in fm.DicoImager.values()]
                    if dico_out:                             # the facets themselves (a DicoFacet-like pickle), for dico_facet_stats
                        import pickle
                        with open(dico_out, "wb") as fh:
                            pickle.dump(dict(fm.DicoImager), fh)
                finally:
                    os.chdir(cwd)
                    shutil.rmtree(tmp, ignore_errors=True)
                return len(pads), float(sum(p * p for p in pads)), pads


            # ------------------------------------------------------------------ the models
            STEPS = ("target", "initial", "finalize", "corrected")
            CLUSTERED = ("initial", "finalize", "corrected")     # the passes that have a ClusterCat; Step "clustered" = the max of these


            def ddf_peak(model, pad2, nfacets, nband, rows_chunk, nchan, nant, beam_nband, mode="HMP", step="initial"):
                """Predicted max RSS of DDF.py, GB (1e9 B), and the per-term breakdown (model form D, design section 6).
                step: target (the ddfacet-target Clean on grid facets), initial (baseline), finalize or corrected."""
                c = model["ddf"]["coefficients"]
                x1 = pad2 * 16e-9
                terms = {"a": c["a"],
                         "X1a": c["X1a"] * x1,
                         "X1b": c["X1b"] * (nband - 1) * x1,
                         "X3": c["X3"] * rows_chunk * nchan * 16e-9,
                         "X4b": c["X4b"] * beam_nband * nant * nfacets * 8e-9}
                if step == "corrected" and beam_nband:
                    terms["X4c"] = c["X4c"] * nant * nfacets * nchan * 8e-9
                m = (mode or "HMP").upper()
                if m in ("SSD2", "SSD3"):
                    terms["mode=" + m] = c.get("mode=" + m, 0.0)
                if step in ("target", "finalize", "corrected"):
                    terms["step=" + step] = c.get("step=" + step, 0.0)
                return float(sum(terms.values())), terms


            def dico_facet_stats(path, dicomodel=None, transpose=False):
                """Geometry of the facets DDFacet built, from a DicoFacet file (a plain pickle: no DDFacet needed to read it).
                Returns dict(nfac, pad2 = sum NpixFacetPadded^2 over all facets, nfac_nz, pad2_nz = the same over the facets the kMS predict
                KEEPS a model grid for).  killMS keeps the grid only for facets whose cut of the model has positive flux
                (ClassFacetMachine._set_model_grid_worker, killMS#30), and the cut is the whole padded square around the facet centre
                (ClassImToGrid.GiveModelTessel), so with a DicoModel (plain pickle, Comp keyed by pixel) a facet counts when a model component
                pixel falls inside its padded square.  Without one, nfac_nz / pad2_nz equal the all-facet values (the safe, high side)."""
                import pickle
                with open(path, "rb") as fh:
                    d = pickle.load(fh)
                fac = [v for v in d.values() if isinstance(v, dict) and "NpixFacetPadded" in v]
                if not fac:
                    raise RuntimeError("%s has no facets (is it a DicoFacet?)" % path)
                pad = np.array([float(v["NpixFacetPadded"]) for v in fac])
                ext = np.array([[float(x) for x in v["pixExtent"]] for v in fac if "pixExtent" in v]).reshape(-1, 4)
                out = dict(nfac=len(fac), pad2=float((pad ** 2).sum()), nfac_nz=len(fac), pad2_nz=float((pad ** 2).sum()), n_comp=None,
                           npix_est=float(ext[:, [1, 3]].max()) if len(ext) else None)    # the facets tile the image: its size to ~1 %
                if dicomodel:
                    with open(dicomodel, "rb") as fh:
                        m = pickle.load(fh)
                    xy = np.array([k for k in m["Comp"].keys() if isinstance(k, tuple) and len(k) == 2], dtype=float).reshape(-1, 2)
                    if transpose:
                        xy = xy[:, ::-1]
                    ctr = np.array([v["pixCentral"] for v in fac], dtype=float)
                    lo, hi = ctr - (pad / 2.0)[:, None], ctr + (pad / 2.0)[:, None]
                    hit = np.array([bool(np.any(np.all((xy >= lo[i]) & (xy < hi[i]), axis=1))) for i in range(len(fac))]) if len(xy) else \
                        np.zeros(len(fac), bool)
                    out.update(nfac_nz=int(hit.sum()), pad2_nz=float((pad[hit] ** 2).sum()), n_comp=int(len(xy)))
                return out


            def kms_peak(model, rows_total, nchan, ssd=False, ndegrid=None, pad2_nz=None, npix=None):
                """Predicted max RSS of kMS.py, GB (1e9 B); flat in TChunk, NDir and NCPU (phase 1).
                X1: the whole MS (rows_total * nchan).  X2n: the sky model's facet grids: the predict cuts the model image into one complex64
                grid per facet and degrid band and keeps them for the solve, but only for facets with model flux.  ndegrid = NChanSols
                (kMS.py sets Freq.NDegridBand from it); pad2_nz = dico_facet_stats(...)["pad2_nz"], the sum of NpixFacetPadded^2 over the facets
                with flux.  pad2_nz None omits X2n (the plan then under-predicts at large NPix; the caller says so).
                XS: an SSD DicoModel is a dense image (nterms x NPix x NPix) that the predict expands: [SSD] * NPix^2 * 1e-9 (npix None omits it)."""
                c = model["kms"]["coefficients"]
                terms = {"a": c["a"], "X1": c["X1"] * rows_total * nchan * 8e-9}
                if "X2n" in c and pad2_nz is not None and ndegrid is not None:
                    terms["X2n"] = c["X2n"] * ndegrid * pad2_nz * 8e-9
                if ssd:
                    if "XS" in c and npix is not None:
                        terms["XS"] = c["XS"] * npix ** 2 * 1e-9
                    if "model=SSD" in c:
                        terms["model=SSD"] = c["model=SSD"]
                return float(sum(terms.values())), terms


            def ddf_inputs_from_gd(GD, ms, mode=None):
                """Everything ddf_peak needs except the chunk length / ChanStep, from a GD and an MS summary."""
                beam = GD["Beam"]
                bm = beam.get("Model")
                beam_nband = 0 if (bm in (None, "None", "none", "")) else int(beam.get("NBand") or 0)
                return dict(nband=max(1, int(GD["Freq"]["NBand"])), nant=ms["nant"], beam_nband=beam_nband,
                            mode=mode or GD["Deconv"]["Mode"])


            def plan_ddf(model, GD, ms, ram_gb, margin=1.25, step="initial", mode=None,
                         chunk_choices=(4.0, 2.0, 1.0, 0.5), prefer="fidelity", chan_steps=(1, 2, 3, 4, 5, 6, 8, 10, 16, 20),
                         proxy_nodes=0):
                """Search ChunkHours x ChanStep for the largest ChunkHours whose predicted peak x margin fits ram_gb.

                step: target | initial | finalize | corrected, or "clustered" = the largest of initial / finalize / corrected
                (on the real profile corrected is the peak step, on the fast profile initial).  The corrected pass is
                tessellated with Facets.CatCentres if the GD has them (the others without), as the pipeline runs it.
                prefer 'fidelity' (default): the band stays whole while any chunk length fits at ChanStep 1; only if none
                does, ChanStep is raised to the smallest value at which one fits, and the largest chunk at that ChanStep is
                taken.  prefer 'speed': the largest chunk wins even if it costs band (the smallest ChanStep that fits that
                chunk is used).  Memory is flat in NCPU (phase 1), so NCPU is not part of the search.
                Returns (best or None, every combination tried, {step: (nfacets, sum pad^2)}); an entry is dict(chunk_hours,
                chan_step, nchan, rows_chunk, peak_gb, planned_gb, fits, limit_step)."""
                import copy
                steps = CLUSTERED if step == "clustered" else (step,)
                geoms = {}
                for st in steps:
                    g = copy.deepcopy(GD)
                    if st != "corrected":
                        g["Facets"]["CatCentres"] = None
                    n, p2, _ = tessellate(g, ms["ra"], ms["dec"], proxy_nodes=proxy_nodes)
                    geoms[st] = (n, p2)
                base = ddf_inputs_from_gd(GD, ms, mode=mode)
                sel = GD["Selection"]
                feasible, allp = [], []
                for cs in chan_steps:
                    nch = nchan_selected(ms["nchan"], sel.get("ChanStart"), sel.get("ChanEnd"), cs)
                    for ch in chunk_choices:
                        rows = chunk_rows(ms["times"], ch)
                        per = {st: ddf_peak(model, geoms[st][1], geoms[st][0], rows_chunk=rows, nchan=nch, step=st, **base)[0]
                               for st in steps}
                        lim = max(per, key=per.get)
                        peak = per[lim]
                        e = dict(chunk_hours=ch, chan_step=cs, nchan=nch, rows_chunk=rows, peak_gb=peak,
                                 planned_gb=peak * margin, fits=bool(peak * margin <= ram_gb), limit_step=lim,
                                 by_step={k: round(v, 3) for k, v in per.items()})
                        allp.append(e)
                        if e["fits"]:
                            feasible.append(e)
                if not feasible:
                    return None, allp, geoms
                if prefer == "speed":
                    best = max(feasible, key=lambda e: (e["chunk_hours"], -e["chan_step"]))
                else:
                    best = min(feasible, key=lambda e: (e["chan_step"], -e["chunk_hours"]))
                return best, allp, geoms
            '''
            L = types.ModuleType("memplan_lib")
            exec(compile(_LIB_SOURCE, "memplan_lib.py", "exec"), L.__dict__)
            _MODEL_JSON = r'''{
              "schema": 2,
              "ddf_form": "D",
              "source_note": "kMS refit 2026-10-20 (a + X1 + X2n + XS) on spark memplan-p1 + p2 + p3 + x86 #63; the DDF block is unchanged from the 2026-10-18 fit (phase 2b)",
              "fitted": "2026-10-18",
              "kms_fitted": "2026-10-20",
              "metric": "maxrss",
              "units": "GB = 1e9 B of peak max RSS of the DDF.py / kMS.py process",
              "generated_by": "tools/memplan-fit.py --write-model",
              "design": "research/MEMORY_PLAN_CALIBRATION.md",
              "data": {
                "spark_runs": [
                  {
                    "file": "memplan-p1/runs.tsv",
                    "sha256": "5a84066ae97cf4cb"
                  },
                  {
                    "file": "memplan-p2/runs.tsv",
                    "sha256": "d15598bb98ac0261"
                  },
                  {
                    "file": "memplan-p3/runs.tsv",
                    "sha256": "d163d673692a7020"
                  }
                ],
                "x86_roots": [
                  "p63-seeds",
                  "p63-pilot",
                  "p63-sweep"
                ],
                "ddf_note": "ddf block: spark p1 + p2(+2b) + x86, as fitted 2026-10-18 (memplan-model.json at b94bda0)"
              },
              "ddf": {
                "coefficients": {
                  "a": 2.859072759137936,
                  "X1a": 6.432169915424643,
                  "X1b": 1.2758777554575422,
                  "X3": 5.545856734216099,
                  "X4b": 1317.6617067746115,
                  "X4c": 320.69336316668733,
                  "mode=SSD2": 7.244818351988027,
                  "mode=SSD3": 4.525180971250868,
                  "step=target": 4.677938712402524,
                  "step=finalize": -0.8285736122373915,
                  "step=corrected": -0.5404716289562581
                },
                "features": {
                  "a": "constant floor (GB)",
                  "X1a": "sum over facets of NpixFacetPadded^2, times 16e-9: first band of facet grids + per-facet machinery",
                  "X1b": "(Freq.NBand - 1) * sum over facets of NpixFacetPadded^2, times 16e-9: each further band's grids",
                  "X3": "rows in one Data.ChunkHours chunk * nchan after Selection.ChanStep, times 16e-9: visibility buffers",
                  "X4b": "Beam.NBand * NA * nfacets, times 8e-9: beam Jones cubes, one per beam band (no channel axis); 0 with the beam off",
                  "X4c": "[step == corrected] * NA * nfacets * nchan, times 8e-9 (beam on): the corrected step's per-channel, per-facet term",
                  "mode=SSD2": "1 for Deconv.Mode SSD2 (GB added)",
                  "mode=SSD3": "1 for Deconv.Mode SSD3 (GB added)",
                  "step=target": "1 for the ddfacet-target step, a Clean on grid facets (GB added; initial is the baseline)",
                  "step=finalize": "1 for the finalize step (GB added)",
                  "step=corrected": "1 for the DD-corrected step (GB added)"
                },
                "npoints": 181,
                "underdetermined": false,
                "dropped_terms": []
              },
              "kms": {
                "coefficients": {
                  "a": 7.888278507526808,
                  "X1": 20.600866572952196,
                  "X2n": 0.5187324744643504,
                  "XS": 757.1023690300507
                },
                "features": {
                  "a": "constant floor (GB)",
                  "X1": "rows_total (the WHOLE MS, not a TChunk) * nchan, times 8e-9",
                  "X2n": "NDegridBand (= NChanSols: kMS.py sets Freq.NDegridBand from it) * sum of NpixFacetPadded^2 over the facets that hold model flux (a model component pixel inside the facet's padded square), times 8e-9: the predict's per-facet model grids (complex64, one plane per degrid band; killMS keeps them only for facets with flux)",
                  "XS": "[sky model is SSD] * NPix^2 * 1e-9: an SSD DicoModel is a dense image (Comp Vals, nterms x NPix x NPix) that the predict expands, so its cost follows the image size (HMP models are sparse pixel lists)"
                },
                "npoints": 73,
                "underdetermined": false,
                "dropped_terms": []
              }
            }
            '''
            # ---- end of the inlined code ----
            model = L.load_model_text(_MODEL_JSON, "memplan-model.json")
            print(L.model_banner(model))
            notes = []

            GD = L.ddf_gd(_opt("Parset"))
            L.set_gd(GD,
                     Image=dict(NPix=_opt("NPix"), Cell=_opt("Cell")),
                     Facets=dict(Padding=_opt("Padding"), DiamMax=_opt("DiamMax"), DiamMin=_opt("DiamMin"),
                                 NFacets=_opt("NFacets")),
                     Freq=dict(NBand=_opt("NBand")),
                     Beam=dict(Model=_opt("BeamModel"), NBand=_opt("BeamNBand")))
            for _what in ("CatNodes", "CatCentres"):
                _path = _opt(_what)
                if _path is None:
                    continue
                if not os.path.exists(_path):
                    _note = ("%s %s does not exist yet: planning from the NFacets grid (or NDirections synthetic "
                             "directions), which only approximates a clustered run's facets (declare this plan "
                             "after the step that writes it)"
                             % (_what, _path))
                    print("WARNING: " + _note)
                    notes.append(_note)
                    _path = None
                GD["Facets"][_what] = _path

            ms = L.ms_info(MS, field=int(Field))
            mode = _opt("Mode") or GD["Deconv"]["Mode"]
            step = _opt("Step", "initial")
            ram_source = "RamGB"
            ram_gb = _opt("RamGB")
            if ram_gb is None:
                ram_gb, ram_source = L.available_gb(), "available on this host"
            ram_gb = float(ram_gb)
            cores = int(_opt("WantNCPU") or L.usable_cores())
            margin = float(Margin)
            beam_nband = (0 if GD["Beam"]["Model"] in (None, "None", "none", "")
                          else int(GD["Beam"]["NBand"] or 0))
            print("MS %s: %d rows over %.2f h, %d chan, %d antennas; NPix %s, Cell %s arcsec, Padding %s, "
                  "NBand %s, Beam %s/%s, mode %s, step %s"
                  % (os.path.basename(MS.rstrip("/")), ms["nrows"], ms["hours"], ms["nchan"], ms["nant"],
                     GD["Image"]["NPix"], GD["Image"]["Cell"], GD["Facets"]["Padding"], GD["Freq"]["NBand"],
                     GD["Beam"]["Model"], GD["Beam"]["NBand"], mode, step))
            print("budget %.1f GB (%s); %d core(s)%s; margin x%g"
                  % (ram_gb, ram_source, cores, "" if _opt("WantNCPU") else " usable", margin))

            best, tried, geoms = L.plan_ddf(model, GD, ms, ram_gb, margin=margin, step=step, mode=mode,
                                                   prefer=_opt("Prefer", "fidelity"),
                                                   proxy_nodes=int(_opt("NDirections", 0)))
            nfac, pad2 = geoms[best["limit_step"] if best else sorted(geoms)[0]]
            for _st, (_n, _p) in geoms.items():
                print("tessellation (%s): %d facets, sum padded px^2 %.4g" % (_st, _n, _p))
            print("  %-10s %-8s %-6s %-11s %-10s %-10s %s" % ("ChunkHours", "ChanStep", "nchan", "rows/chunk",
                                                             "peak GB", "x margin", "fits"))
            for e in tried:
                if e["chan_step"] == 1 or (best and e["chan_step"] == best["chan_step"]):
                    print("  %-10g %-8d %-6d %-11d %-10.1f %-10.1f %-10s %s" % (
                        e["chunk_hours"], e["chan_step"], e["nchan"], e["rows_chunk"], e["peak_gb"],
                        e["planned_gb"], e["limit_step"], "yes" if e["fits"] else "no"))

            Plan = _opt("PlanOut", "ddfacet-memory-plan.json")
            RamGBUsed = ram_gb
            NFacetsPlanned = int(nfac)
            if best is None:
                NCPU, ChunkHours, ChanStep, PeakGB, PlannedGB, Flags = cores, 0.5, 1, 0.0, 0.0, ""
                with open(Plan, "w") as _fh:
                    json.dump(dict(fits=False, ram_gb=ram_gb, margin=margin, nfacets=nfac, sum_pad2=pad2,
                                   notes=notes, tried=tried), _fh, indent=2)
                raise RuntimeError("ddfacet-memory-plan: nothing in the search space fits %.1f GB at margin x%g "
                                   "(smallest predicted %.1f GB) -- see %s"
                                   % (ram_gb, margin, min(e["peak_gb"] for e in tried), Plan))
            NCPU = cores
            warnings = []
            ChunkHours, ChanStep = float(best["chunk_hours"]), int(best["chan_step"])
            PeakGB, PlannedGB = float(best["peak_gb"]), float(best["planned_gb"])
            if ChanStep > 1:
                _w = ("WARNING: no ChanStep 1 plan fits %.1f GB (margin x%g); --Selection-ChanStep %d selects every "
                      "%s channel and DISCARDS %d/%d of the data"
                      % (ram_gb, margin, ChanStep, "%d%s" % (ChanStep, "th" if ChanStep > 3 else ("nd", "rd")[ChanStep - 2]),
                         ChanStep - 1, ChanStep))
                print(_w)
                warnings.append(_w)
            Flags = " ".join((["--Selection-ChanStep %d" % ChanStep] if ChanStep != 1 else [])
                             + ["--Parallel-NCPU %d" % NCPU, "--Data-ChunkHours %g" % ChunkHours])
            _, terms = L.ddf_peak(model, pad2, nfac, nband=int(GD["Freq"]["NBand"]), rows_chunk=best["rows_chunk"],
                                  nchan=best["nchan"], nant=ms["nant"], beam_nband=beam_nband, mode=mode,
                                  step=best["limit_step"])
            print("plan: %s   predicted peak %.1f GB, x%g = %.1f GB of %.1f GB"
                  % (Flags, PeakGB, margin, PlannedGB, ram_gb))
            with open(Plan, "w") as _fh:
                json.dump(dict(fits=True, ncpu=NCPU, chunk_hours=ChunkHours, chan_step=ChanStep, peak_gb=PeakGB,
                               planned_gb=PlannedGB, margin=margin, ram_gb=ram_gb, ram_source=ram_source,
                               mode=mode, step=step, limit_step=best["limit_step"], by_step=best["by_step"],
                               nfacets=int(nfac), sum_pad2=pad2, terms=terms,
                               model_fitted=model.get("fitted"), flags=Flags, notes=notes, warnings=warnings, tried=tried),
                          _fh, indent=2)
