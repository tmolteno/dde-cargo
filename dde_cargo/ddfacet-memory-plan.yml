# GENERATED by tools/build-memplan-cabs.py from cabs/ddfacet-memory-plan.yml.in, tools/memplan_lib.py and
# memplan-model.json (and the image pins of pyproject.toml).  DO NOT EDIT THIS FILE: edit the template or the
# sources and run tools/build-memplan-cabs.py.  `--check` fails when this file is stale.
#
# stimela cab: ddfacet-memory-plan
#
# Chooses --Parallel-NCPU, --Data-ChunkHours and (only when it has to) --Selection-ChanStep for a DDFacet run, from
# the geometry that run will use, the MS, and a memory budget.  It replaces upstream's DDFacet/ToolsDir/
# ModEstimateMemory.py planner, whose threaded model under-predicted the fast profile 6-10x; THIS file is now the
# planner (the copy in the DDFacet package is stale, and the old "copied verbatim from the package" note is gone).
#
# THE MODEL (form D, design section 6)
#   peak = a + c1a*S + c1b*(NBand-1)*S + c3*rows_chunk*nchan*16e-9 + c4b*BeamNBand*NA*nfacets*8e-9
#            + c4c*[corrected]*NA*nfacets*nchan*8e-9 + {SSD2, SSD3 add-on} + {target, finalize, corrected offset}
#   S = sum over facets of NpixFacetPadded^2 * 16e-9      peak = max RSS of the DDF.py process, GB = 1e9 B
#   The beam term has no channel axis (cubes per beam band) except in the corrected pass, which carries a per-channel,
#   per-facet term (X4c).  `initial` is the baseline; `target` is the ddfacet-target Clean on grid facets.  Pure
#   Output-Mode Dirty is not a pipeline step and is not modelled.
#   Flat in NCPU: the rayon line's workers are threads in one process (measured 13.2 / 13.6 / 13.8 GB at NCPU 4 /
#   12 / 20), so NCPU is not a memory knob: the plan returns every usable core (or WantNCPU) and searches memory
#   over ChunkHours and ChanStep only.
#   The coefficients are edited in memplan-model.json (repo root), the single source of truth, and INLINED into this
#   file by tools/build-memplan-cabs.py (see SELF-CONTAINED below); it is written by `tools/memplan-fit.py RUNS.TSV [RUNS.TSV ...] --write-model memplan-model.json` (a joint fit on the
#   spark points and the x86 #63 points).  Calibration of 2026-10-18: phase 1 (fast profile) and phase 2 / 2b (real
#   profile), spark (arm64, 20 cores): runs around the base point (NPix, facets, Padding, NBand, beam, ChanStep,
#   ChunkHours, mode, step type, NCPU, t0 vs t1); accepted by leave-one-configuration-out (see the fit output).
#   Design, data and acceptance bands: research/MEMORY_PLAN_CALIBRATION.md.  To refit: add runs
#   (tools/memplan-sweep.sh), rerun memplan-fit.py with --write-model (which regenerates this cab), commit the JSON and the cab.
#
# THE FACET GEOMETRY (the term that matters)
#   S and nfacets come from the tessellation DDFacet will actually build, computed BEFORE it runs: tools/
#   memplan_lib.py calls DDFacet's own ClassFacetMachine.appendMainField / ClassFacetMachineTessel.setFacetsLocs on
#   a facet machine with a stub VisServer that carries only the phase centre (read from the MS FIELD table), with
#   NPix, Cell, Padding, DiamMax/DiamMin, NFacets, CatNodes and CatCentres.  Validated on the 32 phase-1 runs (checked again on the real profile): facet
#   count and sum NpixFacetPadded^2 are EXACT on all 32 (B 192 facets, D2-diam1.0 28, D2-diam0.15 620, D2-nocat 144,
#   corrected 134, NPix 4459, t0 199, ...), and so is the rows-per-chunk figure (it follows ClassMS's chunking rule
#   over the MS TIME column).  No visibilities are read.  CatNodes must be the file the run will use: if it does not
#   exist yet (a fresh observation, before the clustering step) the plan falls back to the NFacets grid, or to
#   NDirections synthetic directions (within ~15 % of a real ClusterCat's facet area, the grid is 25-35 % low), and says so;
#   put the plan step AFTER the step that writes it (white-belt-4-ddfacet.yml does).
#
# SELF-CONTAINED (this cab ships in the dde-cargo package, so it reads no host file)
#   The cab code carries tools/memplan_lib.py and memplan-model.json inlined into its python-code command (a source
#   string exec'd into a module, and the model JSON), so it works from a pip install, from any working directory, in
#   the DDFacet image, with no `Lib` / `ModelFile` inputs.  tools/build-memplan-cabs.py generates the cab from this
#   template; `tools/build-memplan-cabs.py --check` (and tests/test_memplan_cabs.py, tools/check-pins.py) fail when the
#   generated file is stale against its sources.
#
# WIRING (white-belt-4-ddfacet.yml): one plan before the first, grid-faceted imaging step, and a second after the
# ClusterCat exists for the clean / finalize / corrected steps:
#
#     ddfacet-memory-plan:
#         cab: ddfacet-memory-plan
#         params:
#             MS: =recipe.target-ms
#             NPix: =steps.estimate-npix.NPixOut
#             Cell: =recipe.pixel-scale
#             CatNodes: '{recipe.ddf-img-prefix}.ClusterCat.npy'
#             Mode: HMP
#             Step: target          # clustered, for the passes that have the ClusterCat
#     inital-masked-deconvolution:
#         params:
#             Parallel.NCPU: =steps.ddfacet-memory-plan.NCPU
#             Data.ChunkHours: =steps.ddfacet-memory-plan.ChunkHours
#             Selection.ChanStep: =steps.ddfacet-memory-plan.ChanStep
#
#   `=steps.<plan>.X` references work only when the plan step is in the same stimela selection (-s) as its consumer.
#   MemWatermarkGB is no longer an output: Parallel.MemWatermarkGB has had no effect since DDFacet#80 (v0.16.0), so
#   nothing is left to wire.
#
# STEP: target (ddfacet-target, grid facets), initial, finalize, corrected, or clustered = the largest of initial /
# finalize / corrected, each on its own tessellation (corrected with CatCentres when given).  On the real profile
# corrected is the peak (33.5 GB against 26 GB for initial); on the fast profile initial is.
#
# SEARCH: NCPU = every usable core (or WantNCPU).  ChunkHours = the largest of {4, 2, 1, 0.5} whose predicted peak
# x Margin fits RamGB at ChanStep 1.  Only if none fits is ChanStep raised (Prefer: fidelity = the smallest ChanStep
# that lets some chunk fit; speed = the largest chunk wins even if it costs band).  Margin (default 1.25) is a
# safety factor on the prediction; the calibration's worst in-band error was -17 %.  RamGB and WantNCPU default to
# what the host offers when the step runs (MemAvailable capped by a cgroup limit; the CPU affinity set).
# A plan with ChanStep > 1 prints a WARNING and lists it under `warnings` in the plan JSON: --Selection-ChanStep N
# selects every Nth channel and DISCARDS (N-1)/N of the data.  (Behaviour is otherwise unchanged.)
# Exit status: nonzero when nothing fits, with the plan JSON written.
#
# LOW-MEMORY OPTIONS (on by default since the pin is DDFacet v0.16.16): DDFacet's --Data-Prefetch 0 (one chunk's visibility / flag
# / weight / BDA buffers fewer, slower reads; DDFacet#145) and --Facets-PSFPass separate (the PSF facet machine leaves the first
# pass's peak, at one more read of the data; DDFacet#146).  Both are bit-identical in the images.  Images older than v0.16.16 do not
# accept them: set the input AllowLowMemOptions false for those.  The model must also carry a fitted coefficient for the option (P0
# for Prefetch; PS and PL for PSFPass, in memplan-model.json, from the NGC 7541 A/B, research/MEMORY_PLAN_CALIBRATION.md section
# 13): with none, the option is predicted to change nothing and is never chosen.  PSFPass separate only saves in the pass that
# grids the PSF and is only counted at the PSFOversize it was measured at (1.5); at another one the plan does not use it.  Search
# order: at each ChunkHours, largest first, the default options, then PSFPass
# separate, then Prefetch 0, then both; ChunkHours is shrunk only when none of those fits, and ChanStep raised only after that.
# DegridGroup (DDFacet#148, after v0.16.16): the degrid builds and frees the model grids in groups of K facets (at most 2K alive) instead
# of caching one per flux facet for the whole major cycle, so the later cycles stop growing.  The plan reads K from the image's own parset
# (Facets.DegridGroup; absent in v0.16.16 = 0, so today's plans are unchanged; 16 in a release with #148) or from the DegridGroup input,
# and then predicts the later cycles at PLG + the 2K-grid cache instead of PL (memplan-model.json, section 13 / 14 of the calibration).
# PSF pass without prefetch (DDFacet#151 / PR #152, v0.16.19): with PSFPass separate the PSF pass reads without prefetch by itself, so the
# first pass's PSF half (its peak) is predicted at the Prefetch 0 level (P0F).  No parset key: the planner probes the image (ClassVisServer
# defines prefetchDisabled), so older images keep their plans; the plan JSON records psf_prefetch_off.
# Prefer speed uses the options only to keep the largest chunk at the smallest ChanStep (they cost wall time).  The outputs
# Prefetch (1) and PSFPass (joint) are the defaults unless chosen, and are added to Flags only when non-default; recipes pass
# them always (DDFacet's own defaults when off; not IF(steps..., UNSET), which fails validation -- see white-belt-4-ddfacet.yml).
#
# History: v0.10 vendored the package cab; v0.12 added the threaded (flat-NCPU) planning of 2026-09-27; the model
# was recalibrated on 2026-10-18 and moved here, out of DDFacet.

vars:
  ddfacet-memory-plan:
    image:
      registry: ghcr.io/tmolteno
      name: ddfacet
      # The planner runs DDFacet's tessellation, so pin it to the imaging pin (tools/check-pins.py).
      version: v0.16.25

cabs:
    ddfacet-memory-plan:
        info: |
            Choose --Parallel-NCPU, --Data-ChunkHours and (if the band must give) --Selection-ChanStep for a DDFacet
            run: the calibrated peak-memory model (memplan-model.json) evaluated on the run's real facet tessellation.
        image:
            _use: vars.ddfacet-memory-plan.image
        inputs:
            MS:
                dtype: MS
                required: true
                info: the MS the run images; read for rows, time span, channels, antennas and the phase centre only
            Field:
                dtype: int
                default: 0
                info: the MS field (Selection.Field)
            Parset:
                dtype: File
                required: false
                info: >
                    a parset whose options are the starting point (e.g. the parset_out of an earlier step).  Optional:
                    DDFacet's defaults are used otherwise.  The inputs below override whatever it says.
            NPix:
                dtype: int
                required: false
                info: Image.NPix
            Cell:
                dtype: float
                required: false
                info: Image.Cell, arcsec
            Padding:
                dtype: float
                required: false
                info: Facets.Padding
            DiamMax:
                dtype: float
                required: false
                info: Facets.DiamMax, deg
            DiamMin:
                dtype: float
                required: false
                info: Facets.DiamMin, deg
            NFacets:
                dtype: int
                required: false
                info: Facets.NFacets (the node grid when there is no CatNodes)
            CatNodes:
                dtype: File
                required: false
                must_exist: false
                info: >
                    Facets.CatNodes, the ClusterCat the run will use.  Need not exist yet: if absent the NFacets grid
                    is planned and the plan says so
            CatCentres:
                dtype: File
                required: false
                must_exist: false
                info: Facets.CatCentres (auto-facet centres), when the run uses them
            NDirections:
                dtype: int
                default: 0
                info: >
                    when there is no CatNodes (none given, or not written yet): plan around this many synthetic DD
                    directions on a sunflower disc (as plan-uvmax does) instead of the NFacets grid, which
                    under-counts a clustered run's facets by 25-35 %.  0 = the grid, which is right for a run that
                    really has no CatNodes
            NBand:
                dtype: int
                required: false
                info: Freq.NBand
            BeamModel:
                dtype: str
                required: false
                info: Beam.Model (None or any beam model; None switches the beam term off)
            BeamNBand:
                dtype: int
                required: false
                info: Beam.NBand
            Mode:
                dtype: str
                required: false
                choices: [HMP, SSD2, SSD3]
                info: "Deconv.Mode; default is the parset's, else DDFacet's default (HMP)"
            Step:
                dtype: str
                default: initial
                choices: [target, initial, finalize, corrected, clustered]
                info: >
                    which pass is being planned: target = ddfacet-target (a Clean on grid facets); clustered = the
                    largest of initial / finalize / corrected, the safe choice for a plan shared by those passes
            RamGB:
                dtype: float
                required: false
                info: >
                    memory the run may use, GB.  Default: what the host has available when the step runs --
                    MemAvailable, capped by the cgroup memory limit if there is one
            WantNCPU:
                dtype: int
                required: false
                info: >
                    worker count you would like; also the cap.  Default: the usable cores (the CPU affinity set, so a
                    taskset/cpuset is respected)
            DegridGroup:
                dtype: int
                required: false
                info: >
                    the --Facets-DegridGroup the DDFacet step will run with (DDFacet#148: the degrid builds and frees the
                    model grids in groups of this many facets, at most 2x alive, so the later major cycles stop growing; 0 =
                    cache every flux facet's grid).  Unset (the default): the image's own default, read from its parset
                    (v0.16.16 has no such option, so 0 and the plan is unchanged; a release with #148 defaults to 16).  Only the
                    prediction uses it, the plan emits no flag for it
            Margin:
                dtype: float
                default: 1.25
                info: safety factor on the predicted peak before it is compared with RamGB
            Prefer:
                dtype: str
                default: fidelity
                choices: [fidelity, speed]
                info: "'fidelity' keeps the full band while any chunk length fits; 'speed' takes the largest chunk first and subsamples the band if it must"
            AllowLowMemOptions:
                dtype: bool
                default: true
                info: >
                    the DDFacet image accepts --Data-Prefetch and --Facets-PSFPass (DDFacet#145 / #146; DDFacet >= v0.16.16,
                    the image this cab is pinned to).  True (the default): the search may use PSFPass separate, then
                    Prefetch 0 (in that order, before shrinking ChunkHours), for as many of them as the model has a fitted
                    saving coefficient (and PSFPass separate only at the PSFOversize it was fitted at).  False: the plan never
                    chooses or emits them; set it for a DDFacet image older than v0.16.16
            PlanOut:
                dtype: File
                default: ddfacet-memory-plan.json
                # the command *writes* this file, so stimela must not require it
                # to exist before the step starts (DDFacet#17)
                must_exist: false
                info: where to write the plan, as JSON
        outputs:
            NCPU:
                dtype: int
                info: pass to --Parallel-NCPU
            ChunkHours:
                dtype: float
                info: pass to --Data-ChunkHours
            ChanStep:
                dtype: int
                info: pass to --Selection-ChanStep
            Prefetch:
                dtype: int
                info: >
                    --Data-Prefetch: 1 (DDFacet's default) unless the plan chose 0; white-belt-4-ddfacet.yml passes it
                    always, as Data.Prefetch = (Prefetch != 0)
            PSFPass:
                dtype: str
                info: >
                    --Facets-PSFPass: joint (DDFacet's default) unless the plan chose separate; white-belt-4-ddfacet.yml
                    passes it always
            PeakGB:
                dtype: float
                info: predicted max RSS of the DDF.py process at those settings, GB (1e9 B), without Margin
            PlannedGB:
                dtype: float
                info: PeakGB x Margin, the figure that was compared with the budget
            RamGBUsed:
                dtype: float
                info: the budget the plan was made for (RamGB, or what the host offered)
            NFacetsPlanned:
                dtype: int
                info: facets in the tessellation the prediction used
            Flags:
                dtype: str
                info: the flags, ready to paste (--Data-Prefetch 0 / --Facets-PSFPass separate only when chosen)
            Plan:
                dtype: File
                must_exist: false
                info: the JSON plan (chosen settings, the model's terms, every combination tried, notes)
        flavour:
            kind: python-code
        command: |
            import json
            import os

            # Optional inputs may arrive unset, in which case stimela does not
            # necessarily define the name at all -- look them up defensively.
            _g = globals()


            def _opt(name, default=None):
                value = _g.get(name, default)
                return default if value is None else value


            # ---- inlined by tools/build-memplan-cabs.py: tools/memplan_lib.py and memplan-model.json (no host file) ----
            import types
            _LIB_SOURCE = r'''"""Memory-plan library: the calibrated peak-memory models and the facet tessellation they need.

            Used by cabs/ddfacet-memory-plan.yml and cabs/killms-memory-plan.yml, which carry it INLINED (generated by
            tools/build-memplan-cabs.py; edit this file, not the cabs), and by cabs/plan-uvmax.yml, a local pipeline-specific cab that
            loads it through a `File` input (`Lib`, default tools/memplan_lib.py); it is not a package.  The coefficients are NOT here: they are in memplan-model.json, written by `tools/memplan-fit.py
            --write-model`, so a refit only regenerates that file.  Design and data: research/MEMORY_PLAN_CALIBRATION.md.

            The DDFacet part needs the DDFacet image (it runs DDFacet's own tessellation); the kMS part needs only numpy and
            casacure.  Nothing here reads visibilities: the MS is read for its row/time/channel/antenna counts and phase centre.
            """
            import contextlib
            import io
            import json
            import math
            import os
            import shutil
            import tempfile

            import numpy as np

            ONE_GIB = float(1 << 30)


            # ------------------------------------------------------------------ the host
            def usable_cores():
                try:
                    return len(os.sched_getaffinity(0))
                except AttributeError:
                    return os.cpu_count() or 1


            def available_gb():
                """MemAvailable capped by the cgroup (v2) limit, in GiB: what this run can use.  (RamGB inputs are GiB-ish
                budgets, as before; the model's GB are 1e9 B, so the model is slightly pessimistic against a GiB budget.)"""
                avail = None
                with open("/proc/meminfo") as fh:
                    for line in fh:
                        if line.startswith("MemAvailable:"):
                            avail = int(line.split()[1]) * 1024
                try:
                    cg = open("/proc/self/cgroup").read().strip().split("::", 1)[-1]
                    d = "/sys/fs/cgroup" + cg
                    mx = open(d + "/memory.max").read().strip()
                    if mx != "max":
                        free = int(mx) - int(open(d + "/memory.current").read())
                        avail = free if avail is None else min(avail, free)
                except (OSError, ValueError):
                    pass
                return avail / ONE_GIB


            # ------------------------------------------------------------------ the model file
            def load_model(path):
                with open(path) as fh:
                    return load_model_text(fh.read(), path)


            def load_model_text(text, label="memplan-model.json"):
                """The same, from the JSON text (the memory-plan cabs carry it inlined: tools/build-memplan-cabs.py)."""
                m = json.loads(text)
                path = label
                for kind in ("ddf", "kms"):
                    if kind not in m or "coefficients" not in m[kind]:
                        raise RuntimeError("memory model %s has no '%s' coefficients (regenerate it: tools/memplan-fit.py "
                                           "--write-model)" % (path, kind))
                return m


            def model_banner(m):
                return "model %s: fitted %s on %d DDF / %d kMS points (%s)" % (
                    m.get("schema", "?"), m.get("fitted", "?"), m["ddf"].get("npoints", 0), m["kms"].get("npoints", 0),
                    m.get("metric", "?"))


            # ------------------------------------------------------------------ the MS
            def ms_info(ms, field=0, ddid=0):
                """What the models need from an MS, read from the tables (no visibilities): rows, TIME column, channels,
                antennas and the field's phase centre."""
                from casacure.tables import table
                t = table(ms, ack=False, readonly=True)
                try:
                    fid, did = t.getcol("FIELD_ID"), t.getcol("DATA_DESC_ID")
                    sel = (fid == field) & (did == ddid)
                    times = t.getcol("TIME")[sel]
                    nrows_all = t.nrows()
                finally:
                    t.close()
                spw_id = int(table(ms + "::DATA_DESCRIPTION", ack=False).getcol("SPECTRAL_WINDOW_ID")[ddid])
                spw = table(ms + "::SPECTRAL_WINDOW", ack=False)
                nchan = int(len(spw.getcell("CHAN_FREQ", spw_id)))
                spw.close()
                na = table(ms + "::ANTENNA", ack=False)
                nant = na.nrows()
                na.close()
                fld = table(ms + "::FIELD", ack=False)
                ra, dec = (float(x) for x in fld.getcol("PHASE_DIR")[field][0])
                fld.close()
                if ra < 0:
                    ra += 2 * math.pi
                return dict(nrows=int(sel.sum()), nrows_ms=int(nrows_all), times=times, nchan=nchan, nant=int(nant),
                            ra=ra, dec=dec, hours=float((times.max() - times.min()) / 3600.0) if len(times) else 0.0)


            def chunk_rows(times, chunk_hours):
                """Rows in the largest Data.ChunkHours chunk, with DDFacet's own rule (ClassMS: chunk starts at
                arange(T0, T1, hours*3600), each at the first row with TIME >= start).  chunk_hours 0/None = one chunk."""
                n = len(times)
                if not chunk_hours or n == 0:
                    return n
                t0, t1 = times[0], times[-1]
                starts = np.arange(t0, t1, chunk_hours * 3600.0)
                row0 = sorted(set(int(np.argmax(times >= s)) for s in starts)) + [n]
                return int(max(b - a for a, b in zip(row0[:-1], row0[1:])))


            def ms_w_fmax(ms, field=None, block=1000000):
                """(max |w| in metres, top channel frequency in Hz) of an MS: what killMS sizes its W-kernels from (ClassImageSM2 takes wmax =
                max |w| of the UVW column, all rows; the kernels' support follows the shortest wavelength).  field=None: every row."""
                from casacure.tables import table
                t = table(ms, ack=False, readonly=True)
                try:
                    wmax = 0.0
                    for r0 in range(0, t.nrows(), block):
                        n = min(block, t.nrows() - r0)
                        w = np.abs(t.getcol("UVW", startrow=r0, nrow=n)[:, 2])
                        if field is not None:
                            w = w[t.getcol("FIELD_ID", startrow=r0, nrow=n) == field]
                        if w.size:
                            wmax = max(wmax, float(w.max()))
                finally:
                    t.close()
                spw = table(ms + "::SPECTRAL_WINDOW", ack=False)
                # per-row reads: a whole-table getcol of a ragged CHAN_FREQ (SPWs of different widths) raises on casacure >= 3.8.41
                fmax = max(float(np.max(spw.getcell("CHAN_FREQ", i))) for i in range(spw.nrows()))
                spw.close()
                return wmax, fmax


            def degrid_freqs(ms, nbands, ddid=0):
                """The frequencies the kMS predict renders the model at: the mean channel frequency of each of `nbands` (NChanSols: kMS.py
                sets Freq.NDegridBand from it) contiguous groups of the MS's channels (DDFacet ClassVisServer's degrid bands).  Only which
                model pixels are > 0 depends on them (dico_facet_stats), so a group boundary a channel off does not matter."""
                from casacure.tables import table
                spw_id = int(table(ms + "::DATA_DESCRIPTION", ack=False).getcol("SPECTRAL_WINDOW_ID")[ddid])
                spw = table(ms + "::SPECTRAL_WINDOW", ack=False)
                ch = np.asarray(spw.getcell("CHAN_FREQ", spw_id), dtype=float)
                spw.close()
                return np.array([c.mean() for c in np.array_split(np.sort(ch), max(1, min(int(nbands), ch.size)))])


            def nchan_selected(nchan_ms, chan_start=0, chan_end=-1, chan_step=1):
                end = nchan_ms if chan_end is None or chan_end < 0 else min(int(chan_end), nchan_ms)
                return max(1, len(range(int(chan_start or 0), end, max(1, int(chan_step)))))


            # ------------------------------------------------------------------ the DDFacet geometry
            def ddf_gd(parset=None):
                """DDFacet's option dict (all sections, defaults filled in) from a parset, or the defaults alone."""
                from DDFacet.Parset import ReadCFG
                if parset:
                    return ReadCFG.Parset(parset).value_dict
                here = os.path.dirname(ReadCFG.__file__)
                return ReadCFG.Parset(os.path.join(here, "DefaultParset.cfg")).value_dict


            def set_gd(GD, **sections):
                """set_gd(GD, Image=dict(NPix=..), Facets=dict(...)): override options in place, creating nothing new."""
                for sec, opts in sections.items():
                    for k, v in opts.items():
                        if v is not None:
                            GD[sec][k] = v
                return GD


            class _MSStub:
                def __init__(self, ra, dec, name):
                    self.radec, self.MSName = (ra, dec), name


            class _VSStub:
                """The little of a VisServer that ClassFacetMachine.appendMainField reads."""
                def __init__(self, ra, dec, msname, nband):
                    self.ListMS = [_MSStub(ra, dec, msname)]
                    self.GlobalFreqs = np.linspace(1.0e9, 2.0e9, max(1, nband))
                    self.NFreqBands = max(1, nband)


            def _write_proxy_nodes(GD, ra, dec, n, path, frac=0.7):
                """n DD directions on a sunflower (Fermat spiral) disc of radius frac * the image half-width, as a CatNodes npy.
                A stand-in for the flux-clustered ClusterCat that does not exist yet when plan-uvmax runs (stage 0).  Against the
                real ClusterCats of the fast and real profiles (10 nodes, DiamMax 0.3, Padding 3) its sum NpixFacetPadded^2 is
                within +0.9 / +3.6 / +14 / +0.9 % (frac 0.7), where the NFacets=4 grid is 25-35 % low."""
                from DDFacet.ToolsDir import ModCoord
                from DDFacet.ToolsDir.ModToolBox import EstimateNpix
                npix = EstimateNpix(float(GD["Image"]["NPix"]), Padding=1)[0]
                half = GD["Image"]["Cell"] / 3600.0 * math.pi / 180.0 * npix / 2.0
                k = np.arange(n) + 0.5
                r, th = frac * half * np.sqrt(k / n), k * math.pi * (3 - math.sqrt(5))
                ra_n, dec_n = ModCoord.ClassCoordConv(ra, dec).lm2radec(r * np.cos(th), r * np.sin(th))
                cat = np.zeros(n, dtype=[("ra", float), ("dec", float)])
                cat["ra"], cat["dec"] = ra_n, dec_n
                np.save(path, cat)


            def tessellate(GD, ra, dec, msname="stub.ms", proxy_nodes=0, dico_out=None):
                """The facets DDFacet will build: runs ClassFacetMachineTessel.appendMainField (-> setFacetsLocs, AppendFacet)
                itself, on a facet machine whose __init__ is skipped and whose VisServer is a stub carrying the phase centre.
                Needs GD["Image"]["NPix"/"Cell"], ["Facets"]["Padding"/"DiamMax"/"DiamMin"/"NFacets"/"CatNodes"/"CatCentres"].
                proxy_nodes=N (when GD has no CatNodes): tessellate around N synthetic directions instead of the NFacets grid
                (see _write_proxy_nodes).  Returns (nfacets, sum NpixFacetPadded^2, list of padded sizes); dico_out=PATH also pickles the DicoImager there.  Writes its
                .reg/.npy/.DicoFacet side files to a temp dir, and drops DDSols (the nodes then come from CatNodes or the NFacets grid, as for a first imaging pass)."""
                from DDFacet.Imager.ClassFacetMachineTessel import ClassFacetMachineTessel
                from DDFacet.Imager.ClassFacetMachine import ClassFacetMachine
                import copy
                gd = copy.deepcopy(GD)
                tmp = tempfile.mkdtemp(prefix="memplan-tess-")
                cwd = os.getcwd()
                for k in ("CatNodes", "CatCentres"):          # resolve before the chdir below (the recipe passes cwd-relative paths)
                    v = gd["Facets"].get(k)
                    if isinstance(v, str) and v and v.lower() != "none" and not os.path.isabs(v):
                        gd["Facets"][k] = os.path.join(cwd, v)
                try:
                    os.chdir(tmp)                            # DDFacet drops debug .npz files in the cwd on odd polygons
                    gd["Output"]["Name"] = os.path.join(tmp, "out")
                    gd["DDESolutions"]["DDSols"] = ""
                    if proxy_nodes and not gd["Facets"].get("CatNodes"):
                        gd["Facets"]["CatNodes"] = os.path.join(tmp, "proxy.ClusterCat.npy")
                        _write_proxy_nodes(gd, ra, dec, int(proxy_nodes), gd["Facets"]["CatNodes"])
                    fm = object.__new__(ClassFacetMachineTessel)
                    fm.GD, fm.VS = gd, _VSStub(ra, dec, msname, int(gd["Freq"]["NBand"]))
                    fm.npol, fm.DoPSF, fm.DoDDE, fm.Oversize = 1, False, False, 1
                    fm.DicoGridMachine = {}                 # what __del__ looks for
                    try:
                        from DDFacet.Other import logger
                        logger.setSilent(["ClassFacetMachineTessel", "ClassFacetMachine", "VoronoiToReg"])
                    except Exception:                       # chatter only
                        pass
                    sink = io.StringIO()
                    with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                        ClassFacetMachine.appendMainField(fm, Npix=gd["Image"]["NPix"], Cell=gd["Image"]["Cell"],
                                                          NFacets=int(gd["Facets"]["NFacets"]),
                                                          ImageName=os.path.join(tmp, "out"))
                    pads = [int(v["NpixFacetPadded"]) for v in fm.DicoImager.values()]
                    if dico_out:                             # the facets themselves (a DicoFacet-like pickle), for dico_facet_stats
                        import pickle
                        with open(dico_out, "wb") as fh:
                            pickle.dump(dict(fm.DicoImager), fh)
                finally:
                    os.chdir(cwd)
                    shutil.rmtree(tmp, ignore_errors=True)
                return len(pads), float(sum(p * p for p in pads)), pads


            # ------------------------------------------------------------------ the models
            STEPS = ("target", "initial", "finalize", "corrected")
            CLUSTERED = ("initial", "finalize", "corrected")     # the passes that have a ClusterCat; Step "clustered" = the max of these


            PSF_STEPS = ("target", "initial", "corrected")        # the runs that grid the PSF (fresh cache); finalize loads it (Cache.PSF force)


            def psf_fit_applies(model, psf_oversize):
                """True when the model's PSFPass coefficients (PS, PL) were measured at this Facets.PSFOversize.  The PSF machine's CFs
                do not scale with X1a, so the saving is a statement about one PSFOversize: at another one (or an unknown one, or a model
                without the recorded fit) the planner counts no saving."""
                fit = (model["ddf"].get("lowmem_fit") or {}).get("PSFOversize")
                if fit is None or psf_oversize in (None, "", "None"):
                    return False
                try:
                    return abs(float(psf_oversize) - float(fit)) < 1e-9
                except (TypeError, ValueError):
                    return False


            def degrid_group(GD=None, explicit=None):
                """K, the --Facets-DegridGroup the DDFacet run will use (DDFacet#148: the degrid builds and frees the model grids in groups of K
                facets, at most 2K alive; 0 = cache every flux facet's grid for the whole major cycle).  `explicit` (a value the step passes) wins;
                else the GD's Facets.DegridGroup, which is the DDFacet image's own default (the planner runs inside the image it plans for);
                an image without the option (v0.16.16 and older) has no such key, so K = 0 and the plan is the one it always was.
                Unreadable or negative: 0 (no claimed saving)."""
                v = explicit
                if v is None:
                    v = ((GD or {}).get("Facets") or {}).get("DegridGroup")
                try:
                    return max(0, int(float(v)))
                except (TypeError, ValueError):
                    return 0


            def _ddfacet_dir():
                """The directory of the DDFacet package in use, or None (found without importing it)."""
                import importlib.util
                try:
                    spec = importlib.util.find_spec("DDFacet")
                except (ImportError, ValueError):
                    return None
                locs = list(getattr(spec, "submodule_search_locations", None) or [])
                return locs[0] if locs else None


            def psf_prefetch_off(explicit=None):
                """True when the DDFacet in use runs the PSF pass of `--Facets-PSFPass separate` with prefetch off (DDFacet#151 / PR #152: the
                first release with it is v0.16.19; v0.16.18 and older read ahead in that pass).  There is no parset key for it, so this is a
                feature probe: the image's own ClassVisServer.py defines `prefetchDisabled` (the context manager the PSF pass runs in).  The
                source file is scanned, not imported (the import pulls in the whole data stack), and an install that cannot be found, read, or
                that lacks the method is False: the plan is then the one it always was.  A version test was rejected: it is parsed text, and dev
                or overlay builds carry no version worth comparing, while the probe asks about the code that runs.  `explicit` (the step knows
                better) wins."""
                if explicit is not None:
                    return bool(explicit)
                d = _ddfacet_dir()
                if not d:
                    return False
                try:
                    with open(os.path.join(d, "Data", "ClassVisServer.py")) as fh:
                        return "def prefetchDisabled(" in fh.read()
                except (OSError, UnicodeDecodeError):
                    return False


            def degrid_nbands(GD, nchan):
                """NDegridBand the run will use: Freq.NDegridBand, or one per selected channel when it is 0 (DDFacet's meaning; a DegridBandMHz
                step is taken as the per-channel upper bound).  Never more than the selected channels."""
                n = int(((GD or {}).get("Freq") or {}).get("NDegridBand") or 0)
                return max(1, min(n, int(nchan)) if n > 0 else int(nchan))


            def degrid_cache_gb(pad2, nfacets, ndegrid, k):
                """The model-grid cache of the grouped degrid, GB: at most min(2K, nfacets) grids alive, each NDegridBand * NpixFacetPadded^2 * 8 B
                (complex64) for a MEAN facet (pad2 / nfacets).  Mean, not largest: which facets carry flux is unknown to the planner, and at
                NGC 7541 cycle 0 the flux facets were 1.08x the mean (120 MB against 111 MB; the largest facet is 1.59x); the 1.25 margin covers
                that spread, and the PLG fit is conservative (it takes the leg with the larger residual)."""
                if k <= 0 or nfacets <= 0:
                    return 0.0
                return min(2 * int(k), int(nfacets)) * int(ndegrid) * 8.0 * (pad2 / nfacets) * 1e-9


            def ddf_peak(model, pad2, nfacets, nband, rows_chunk, nchan, nant, beam_nband, mode="HMP", step="initial",
                         prefetch=1, psfpass="joint", psf_oversize=None, degrid_group=0, ndegrid=None, psf_prefetch_off=False):
                """Predicted max RSS of DDF.py, GB (1e9 B), and the per-term breakdown (model form D, design section 6).
                step: target (the ddfacet-target Clean on grid facets), initial (baseline), finalize or corrected.
                prefetch / psfpass: DDFacet's --Data-Prefetch (1 = default) and --Facets-PSFPass (joint = default), DDFacet#145 / #146.
                Prefetch 0 adds the model's "P0" term (P0 * rows_chunk * nchan * 16e-9, the X3 unit; fitted negative: one chunk's buffers
                less, in every pass).  PSFPass separate takes the PSF machine out of the FIRST pass only: that pass drops by PS * pad2 *
                16e-9 (the X1a unit), but the later cycles are unchanged by it and then set the run's peak, at PL * pad2 * 16e-9 (X1a unit,
                relative to the joint first pass).  The run's peak is the max of the two, so the term added is max(PS, PL) * pad2 * 16e-9 (key
                PS or PL, whichever binds).  Only the steps that grid the PSF (PSF_STEPS; finalize loads it from the cache) get it, only at
                the PSFOversize the coefficients were measured at (psf_fit_applies), and only if the model has all of PS, PL.  A
                coefficient the model does not carry, or a case it does not cover, changes nothing (never a claimed saving).
                degrid_group (K, --Facets-DegridGroup, DDFacet#148) / ndegrid (NDegridBand): the later cycles' peak is then not PL (which includes
                the cache of every flux facet's model grid, at most all of them) but PLG * pad2 * 16e-9 (the later cycles without that cache) plus
                degrid_cache_gb (at most 2K grids alive), and never more than PL.  Needs PLG in the model and ndegrid; K = 0 is the PL case.
                The grouping changes the later cycles only: the first pass (PS) and the joint case are untouched.
                psf_prefetch_off (DDFacet#151 / PR #152, see psf_prefetch_off()): the PSF pass of PSFPass separate reads without prefetch whatever
                --Data-Prefetch says, so the first pass's PSF half (the first pass's peak) is the Prefetch 0 case: its Prefetch term is P0F
                (not P0) in the X3 unit, with or without --Data-Prefetch 0 (one chunk's saving, not both).  The dirty half and the later cycles
                keep the configured prefetch (P0 only if Prefetch 0).  --Data-Prefetch 0 alone (without #152) is the same PSF half, so it also
                takes P0F there (legs P0 and P of section 15 measured it on v0.16.18); P0 stays for the later cycles.  The
                dirty half (38.3 GB at most, A leg) sits below the later cycles in every leg, so the run's peak is max(PSF half, later cycles)."""
                c = model["ddf"]["coefficients"]
                x1 = pad2 * 16e-9
                terms = {"a": c["a"],
                         "X1a": c["X1a"] * x1,
                         "X1b": c["X1b"] * (nband - 1) * x1,
                         "X3": c["X3"] * rows_chunk * nchan * 16e-9,
                         "X4b": c["X4b"] * beam_nband * nant * nfacets * 8e-9}
                if step == "corrected" and beam_nband:
                    terms["X4c"] = c["X4c"] * nant * nfacets * nchan * 8e-9
                p0 = c["P0"] * rows_chunk * nchan * 16e-9 if (int(prefetch) == 0 and c.get("P0", 0.0)) else 0.0
                if (psfpass == "separate" and step in PSF_STEPS and c.get("PS", 0.0) and "PL" in c
                        and psf_fit_applies(model, psf_oversize)):
                    first, later, lkey = c["PS"] * x1, c["PL"] * x1, "PL"
                    fkey, fp0 = "P0", p0                                     # the first pass's prefetch term: P0 unless the PSF pass has no prefetch
                    if (psf_prefetch_off or int(prefetch) == 0) and c.get("P0F", 0.0):   # #152, or no prefetch in any pass
                        fkey, fp0 = "P0F", c["P0F"] * rows_chunk * nchan * 16e-9
                    if degrid_group and ndegrid and "PLG" in c:
                        grouped = c["PLG"] * x1 + degrid_cache_gb(pad2, nfacets, ndegrid, degrid_group)
                        if grouped < later:
                            later, lkey = grouped, "PLG"
                    if first + fp0 >= later + p0:
                        terms["PS"] = first
                        if fp0:
                            terms[fkey] = fp0
                    else:
                        if lkey == "PLG":
                            terms["PLG"] = c["PLG"] * x1
                            terms["DG"] = later - c["PLG"] * x1               # the model-grid cache of the grouped degrid
                        else:
                            terms["PL"] = later
                        if p0:
                            terms["P0"] = p0
                elif p0:
                    terms["P0"] = p0
                m = (mode or "HMP").upper()
                if m in ("SSD2", "SSD3"):
                    terms["mode=" + m] = c.get("mode=" + m, 0.0)
                if step in ("target", "finalize", "corrected"):
                    terms["step=" + step] = c.get("step=" + step, 0.0)
                return float(sum(terms.values())), terms


            def _model_positive_pixels(m, path, freqs=None):
                """(n, 2) int pixels (x, y) where the model image the kMS predict cuts is > 0 in at least one of `freqs`, and how they were
                found.  killMS renders the DicoModel at its degrid bands (ClassImageSM2.LoadModel: MM.GiveModelImage(degrid frequencies)),
                and a facet's SumFlux only adds pixels > 0, so a component counts only where its flux is positive.  With DDFacet importable
                (the killms image) this IS GiveModelImage, band by band; without it, each component's flux is evaluated on its own pixel from
                the DicoModel's alpha basis -- exact for delta components, and the component pixel only for extended scales.  A basis it
                cannot evaluate (nspline) counts a component with any positive coefficient.  freqs None: the model's RefFreq."""
                ref = float(m.get("RefFreq") or 1.0)
                freqs = np.atleast_1d(np.asarray(freqs if freqs is not None else [ref], dtype=float))
                try:
                    from DDFacet.Imager.ModModelMachine import ClassModModelMachine
                except Exception:
                    ClassModModelMachine = None
                if ClassModModelMachine is not None and m.get("GD") is not None:
                    with contextlib.redirect_stdout(io.StringIO()):
                        mm = ClassModModelMachine(m["GD"]).GiveInitialisedMMFromFile(path)
                    pos = None
                    for f in freqs:
                        img = mm.GiveModelImage(np.array([f]))
                        p = (img > 0).any(axis=(0, 1))
                        pos = p if pos is None else (pos | p)
                        del img
                    return np.argwhere(pos), "DDFacet GiveModelImage at %d band(s)" % len(freqs)
                comp = {k: v for k, v in m["Comp"].items() if isinstance(k, tuple) and len(k) == 2}
                scales = m.get("ListScales") or []
                basis = (m.get("SpectralBasis") or {}).get("kind", "alpha")
                keep = []
                for k, v in comp.items():
                    sol = np.asarray(v.get("SolsArray", [0.0]), dtype=float)
                    sol = sol[:, 0] if sol.ndim == 2 else sol.ravel()                  # (nfunc, npol): Stokes I
                    if basis == "alpha" and len(scales) == len(sol):
                        alpha = np.array([float(sc.get("Alpha", 0.0)) for sc in scales])
                        flux = (sol[:, None] * (freqs[None, :] / ref) ** alpha[:, None]).sum(axis=0)
                        ok = bool(np.any(flux > 0))
                    else:
                        ok = bool(np.any(sol > 0))
                    if ok:
                        keep.append(k)
                return np.array(keep, dtype=int).reshape(-1, 2), "DicoModel components (%s basis), %d band(s)" % (basis, len(freqs))


            def _points_in_polygon(x, y, poly):
                """Even-odd point-in-polygon for arrays x, y (matplotlib.path.Path.contains_points, which DDFacet uses, without the import)."""
                inside = np.zeros(np.shape(x), bool)
                px, py = poly[:, 0], poly[:, 1]
                for i in range(len(poly)):
                    x0, y0, x1, y1 = px[i - 1], py[i - 1], px[i], py[i]
                    if y0 == y1:
                        continue
                    crosses = (y0 > y) != (y1 > y)
                    xc = x0 + (y - y0) * (x1 - x0) / (y1 - y0)
                    inside ^= crosses & (x < xc)
                return inside


            def facet_spatial_weight(f, mixing_width, corners=None):
                """A facet's spatial weight SW, as DDFacet builds it (ClassFacetMachine._initcf_worker): the facet polygon (cut to the image
                corners) on the padded facet's grid -- axis 0 l over lmExtentPadded, axis 1 m -- blurred by a Gaussian of sigma MixingWidth
                pixels, normalised to its max, and zero below 1e-3.  DDFacet blurs with ModFFTW.ConvolveGaussian; scipy's gaussian_filter
                (zero outside the grid) gives the same zero/non-zero support (checked against DDFacet's SW on NGC 7541)."""
                from scipy.ndimage import gaussian_filter
                n = int(f["NpixFacetPadded"])
                l0, l1, m0, m1 = (float(v) for v in f["lmExtentPadded"])
                X, Y = np.meshgrid(np.linspace(l0, l1, n), np.linspace(m0, m1, n), indexing="ij")
                mask = _points_in_polygon(X, Y, np.asarray(f["Polygon"], dtype=float))
                if corners is not None:
                    mask &= _points_in_polygon(X, Y, np.asarray(corners, dtype=float))
                sw = gaussian_filter(mask.astype(np.float32), sigma=float(mixing_width), mode="constant", truncate=6.0)
                mx = sw.max()
                if mx > 0:
                    sw /= mx
                sw[sw < 1e-3] = 0.0
                return sw


            def dico_facet_stats(path, dicomodel=None, transpose=False, freqs=None, mixing_width=None, npix=None):
                """Geometry of the facets DDFacet built, from a DicoFacet file (a plain pickle).
                Returns dict(nfac, pad2 = sum NpixFacetPadded^2 over all facets, nfac_nz, pad2_nz = the same over the facets the kMS predict
                KEEPS a model grid for, n_comp, n_pos = model pixels > 0, flux_src).
                killMS keeps a facet's grid -- and builds its grid machine -- only when the facet's SumFlux is non-zero (killMS#30), and
                SumFlux (ClassImToGrid.GiveModelTessel) sums the pixels > 0 of the model cut times the facet's spatial weight SW: the facet
                polygon blurred by MixingWidth, not the whole padded square.  So a facet counts when a model pixel > 0 (at some degrid band:
                `freqs`) falls where its SW is non-zero.  The padded-square test this used before counted 111 facets on the NGC 7541 512-chan
                solve where killMS had 46 (research/MEMORY_PLAN_CALIBRATION.md 12.6).  mixing_width: the solve's Facets.MixingWidth (default
                the DicoModel's GD, else DDFacet's 10); npix: the image size, for the corner cut (default the DicoModel's ModelShape).
                Without a DicoModel nfac_nz / pad2_nz equal the all-facet values (the safe, high side); so does a model with no pixel
                components (an SSD dense image)."""
                import pickle
                with open(path, "rb") as fh:
                    d = pickle.load(fh)
                fac = [v for v in d.values() if isinstance(v, dict) and "NpixFacetPadded" in v]
                if not fac:
                    raise RuntimeError("%s has no facets (is it a DicoFacet?)" % path)
                pad = np.array([float(v["NpixFacetPadded"]) for v in fac])
                ext = np.array([[float(x) for x in v["pixExtent"]] for v in fac if "pixExtent" in v]).reshape(-1, 4)
                out = dict(nfac=len(fac), pad2=float((pad ** 2).sum()), nfac_nz=len(fac), pad2_nz=float((pad ** 2).sum()), n_comp=None,
                           n_pos=None, flux_src=None,
                           npix_est=float(ext[:, [1, 3]].max()) if len(ext) else None)    # the facets tile the image: its size to ~1 %
                if not dicomodel:
                    return out
                with open(dicomodel, "rb") as fh:
                    m = pickle.load(fh)
                ncomp = sum(1 for k in m.get("Comp", {}) if isinstance(k, tuple) and len(k) == 2)
                out["n_comp"] = ncomp
                if ncomp == 0:
                    out["flux_src"] = "no pixel components: every facet counted"
                    return out
                xy, out["flux_src"] = _model_positive_pixels(m, dicomodel, freqs)
                xy = xy.astype(np.int64)
                if transpose:
                    xy = xy[:, ::-1]
                out["n_pos"] = int(len(xy))
                if mixing_width is None:
                    mixing_width = float(((m.get("GD") or {}).get("Facets") or {}).get("MixingWidth", 10) or 10)
                if npix is None:
                    npix = int((m.get("ModelShape") or (0, 0, 0, 0))[-1]) or (int(out["npix_est"]) if out["npix_est"] else None)
                corners = None
                if npix and "DicoConfigGM" in fac[0]:
                    R = np.deg2rad(float(fac[0]["DicoConfigGM"]["Cell"]) / 3600.0) * npix / 2.0      # ClassFacetMachine.CornersImageTot
                    corners = np.array([[-R, -R], [R, -R], [R, R], [-R, R]])
                hit = np.zeros(len(fac), bool)
                for i, f in enumerate(fac):
                    n = int(f["NpixFacetPadded"])
                    xc, yc = (int(v) for v in f["pixCentral"])
                    ij = xy - np.array([xc - n // 2, yc - n // 2])              # padded-grid index (GiveEdges)
                    ij = ij[np.all((ij >= 0) & (ij < n), axis=1)]
                    if not len(ij):
                        continue
                    if "Polygon" not in f or "lmExtentPadded" not in f:      # not a full DicoFacet: the padded square, as before
                        hit[i] = True
                        continue
                    l0, l1, m0, m1 = (float(v) for v in f["lmExtentPadded"])
                    lv, mv = np.linspace(l0, l1, n)[ij[:, 0]], np.linspace(m0, m1, n)[ij[:, 1]]
                    if np.any(_points_in_polygon(lv, mv, np.asarray(f["Polygon"], dtype=float))):
                        hit[i] = True                                         # inside the facet itself: SW is ~1 there
                        continue
                    sw = facet_spatial_weight(f, mixing_width, corners)
                    hit[i] = bool(np.any(sw[ij[:, 0], ij[:, 1]] > 0))
                out.update(nfac_nz=int(hit.sum()), pad2_nz=float((pad[hit] ** 2).sum()))
                return out


            def dico_facet_pads(path):
                """(padded facet sizes, Cell in arcsec) from a DicoFacet: what cf_bytes needs."""
                import pickle
                with open(path, "rb") as fh:
                    d = pickle.load(fh)
                fac = [v for v in d.values() if isinstance(v, dict) and "NpixFacetPadded" in v]
                if not fac:
                    raise RuntimeError("%s has no facets (is it a DicoFacet?)" % path)
                return [int(v["NpixFacetPadded"]) for v in fac], float(fac[0]["DicoConfigGM"]["Cell"])


            # ------------------------------------------------------------------ the W-term kernels
            # DDFacet's ModCF.ClassWTermModified.InitW (and its Rust port, ddfacet-gridder cf.rs), in numpy: every facet of the tessellation
            # gets CF-Nw W-planes and as many conjugates, plane i a complex64 (Sup_i * OverS)^2, packed into one buffer per facet
            # (ModCF.py: NpShared.PackListSquareMatrix).  Sup_i = linspace(CF-Support, SupMax, Nw), made odd, where SupMax is where the
            # W-kernel of the largest w (wmax / lambda_min) over the PADDED facet's field falls to 1e-3 of its peak.  killMS takes
            # wmax = max |w| of the UVW column (ClassImageSM2), so a low-declination field (large w) at a wide facet costs much more.
            _SPHE_P = ((8.203343e-2, -3.644705e-1, 6.278660e-1, -5.335581e-1, 2.312756e-1),
                       (4.028559e-3, -3.697768e-2, 1.021332e-1, -1.201436e-1, 6.412774e-2))
            _SPHE_Q = ((1.0, 8.212018e-1, 2.078043e-1), (1.0, 9.599102e-1, 2.918724e-1))


            def _eval_sphe(nu):
                """ModTaper.EvalSphe (the prolate spheroidal approximation), vectorised."""
                nu = np.abs(np.asarray(nu, float))
                out = np.zeros_like(nu)
                for part, (lo, hi, inc_hi) in enumerate(((0.0, 0.75, False), (0.75, 1.0, True))):
                    sel = (nu >= lo) & ((nu <= hi) if inc_hi else (nu < hi))
                    d = nu[sel] ** 2 - hi * hi
                    top = sum(c * d ** k for k, c in enumerate(_SPHE_P[part]))
                    bot = sum(c * d ** k for k, c in enumerate(_SPHE_Q[part]))
                    out[sel] = (1.0 - nu[sel] ** 2) * top / bot
                return out


            def _fft2c(a):
                return np.fft.fftshift(np.fft.fft2(np.fft.ifftshift(a))) / a.size


            def _ifft2c(a):
                return np.fft.fftshift(np.fft.ifft2(np.fft.ifftshift(a))) * a.size


            def _zero_pad(a, n):
                b = np.zeros((n, n), a.dtype)
                off = (n - a.shape[0]) // 2 + (1 if n % 2 == 0 else 0)
                b[off:off + a.shape[0], off:off + a.shape[0]] = a
                return b


            _SPHE_W_CACHE = {}


            def _sphe_w(sup, n=501):
                """SpheMachine(Support=sup).MakeSphe(n)[2]: the 111-pixel spheroidal's FFT cut to sup, zero-padded to n, inverse FFT."""
                key = (int(sup), int(n))
                if key not in _SPHE_W_CACHE:
                    ns = 111
                    x = np.linspace(-1.0, 1.0, ns)
                    cf = _eval_sphe(np.sqrt(x[:, None] ** 2 + x[None, :] ** 2)).astype(np.complex128)
                    xc = ns // 2
                    small = _fft2c(cf)[xc - sup // 2:xc + sup // 2 + 1, xc - sup // 2:xc + sup // 2 + 1]
                    s = _ifft2c(_zero_pad(small, n))
                    s[(s.real < 0) | ((s.real == 0) & (s.imag < 0))] = 1e-10       # numpy's complex order: ifzfCF[ifzfCF < 0] = 1e-10
                    _SPHE_W_CACHE[key] = s
                return _SPHE_W_CACHE[key]


            def cf_supports(npix_padded, cell_arcsec, wmax_m, freq_max_hz, sup=7, nw=100):
                """The Nw plane supports InitW gives a facet of npix_padded pixels (ModCF.ClassWTermModified.Sups)."""
                sup, nw = int(sup), int(nw)
                if nw <= 1:
                    return np.array([sup + (1 - sup % 2)], np.int64)
                n = 501
                lrad = (npix_padded / 2.0) * cell_arcsec / 3600.0 * math.pi / 180.0
                a = lrad * math.sqrt(2.0)
                g = np.linspace(-a, a, n)
                n_1 = np.sqrt(1.0 - g[:, None] ** 2 - g[None, :] ** 2) - 1.0
                w = np.exp(-2j * math.pi * (wmax_m / (299792458.0 / freq_max_hz)) * n_1) * _sphe_w(sup, n)
                fw1d = np.abs(_fft2c(w)[(n - 1) // 2, :])
                fw1d = (fw1d / fw1d.max())[(n - 1) // 2:]
                sup_max = sup
                if np.all(np.isfinite(fw1d)):
                    ind = np.argsort(fw1d, kind="stable")
                    xs, ys = fw1d[ind], np.arange(fw1d.size, dtype=float)[ind]
                    if xs[0] <= 1e-3 <= xs[-1]:                                     # interp1d raises outside: InitW keeps SupMax = Sup
                        sup_max = int(np.interp(1e-3, xs, ys))
                sups = np.linspace(sup, max(sup_max, sup), nw).astype(np.int64)
                return sups + (1 - sups % 2)


            def cf_bytes(npix_padded, cell_arcsec, wmax_m, freq_max_hz, sup=7, nw=100, overs=11):
                """Bytes of the packed W-planes (and conjugates) of facets of the given padded sizes: sum 2 * (Sup_i * OverS)^2 * 8."""
                memo, tot = {}, 0.0
                for p in np.atleast_1d(npix_padded):
                    p = int(p)
                    if p not in memo:
                        s = cf_supports(p, cell_arcsec, wmax_m, freq_max_hz, sup, nw).astype(float)
                        memo[p] = 2.0 * float(((s * overs) ** 2).sum()) * 8.0
                    tot += memo[p]
                return tot


            def kms_geometry(base_image, nodes, ms, centres=None, dicomodel=None, field=None, dico_out=None, nchan_sols=None):
                """The facets killMS's predict actually builds, and what they cost: kMS.py takes the base image's parset (<base_image>.parset),
                sets Facets.CatNodes = --NodesFile and Facets.CatCentres = --FacetCentres (when given), and tessellates afresh -- NOT the
                finalize clean's DicoFacet, which it then overwrites in place (NGC 7541 512 chan: 152 facets / 1.50e8 pad^2 with flux, against
                the DicoFacet's 180 / 1.147e8).  Needs the DDFacet image (the killms image has it).
                Returns dico_facet_stats(...) of that tessellation (flux-bearing facets from the DicoModel, default <base_image>.DicoModel,
                rendered at the solve's nchan_sols degrid bands -- None: the model's RefFreq -- with the parset's Facets.MixingWidth) plus
                cf_gb (the W-kernels: cf_bytes over every facet with the parset's [CF] Support / Nw / OverS, the MS's max |w| and top channel),
                wmax_m, fmax_hz, cell_arcsec and cf (Support, Nw, OverS)."""
                gd = ddf_gd(base_image + ".parset")
                gd["Facets"]["CatNodes"] = os.path.abspath(nodes)
                gd["Facets"]["CatCentres"] = os.path.abspath(centres) if centres not in (None, "", "None") else None
                info = ms_info(ms, field=0 if field is None else field)
                tmp = None
                if dico_out is None:
                    tmp = tempfile.mkdtemp(prefix="memplan-kmsgeom-")
                    dico_out = os.path.join(tmp, "kms.DicoFacet")
                try:
                    _, _, pads = tessellate(gd, info["ra"], info["dec"], dico_out=dico_out)
                    dm = dicomodel or base_image + ".DicoModel"
                    g = dico_facet_stats(dico_out, dm if os.path.exists(dm) else None,
                                         freqs=degrid_freqs(ms, nchan_sols) if nchan_sols else None,
                                         mixing_width=float(gd["Facets"].get("MixingWidth", 10) or 10))
                finally:
                    if tmp:
                        shutil.rmtree(tmp, ignore_errors=True)
                wmax, fmax = ms_w_fmax(ms)                      # killMS: max |w| over the whole UVW column (ClassImageSM2)
                cfp = (int(gd["CF"]["Support"]), int(gd["CF"]["Nw"]), int(gd["CF"]["OverS"]))
                cell = float(gd["Image"]["Cell"])
                g.update(cf_gb=cf_bytes(pads, cell, wmax, fmax, sup=cfp[0], nw=cfp[1], overs=cfp[2]) / 1e9, wmax_m=wmax, fmax_hz=fmax,
                         cell_arcsec=cell, cf=list(cfp), source="killMS tessellation (parset + NodesFile + FacetCentres)")
                return g


            def kms_tchunk_candidates(tchunk_want, dt_min_minutes=5.0):
                """The --TChunk values (hours) the stage-3 plan (killms-memory-plan) tries, largest first: TChunkWant, then /2 and /4, none below
                0.1 h nor below the solution interval dtMin.  The solve's row term follows TChunk (killMS#46), so the smallest of these is the
                least memory stage 3 can still give the solve."""
                want = float(tchunk_want)
                floor = max(0.1, float(dt_min_minutes) / 60.0)
                return [want] + [t for t in (want / 2, want / 4) if t >= floor - 1e-9]


            def kms_peak(model, rows_total, nchan, ssd=False, ndegrid=None, pad2_nz=None, npix=None, rows_chunk=None, cf_gb=None):
                """Predicted max RSS of kMS.py, GB (1e9 B); flat in NDir and NCPU (phase 1).
                X1c (killMS >= v3.15.15, killMS#46): the rows of the largest --TChunk chunk (chunk_rows(times, TChunk)) * nchan -- the
                solve holds one chunk's data, flags, weights and two predict buffers, and nothing rows x channels for the whole MS.
                X1 (legacy, models fitted before killMS#46): the WHOLE MS (rows_total * nchan); used only when the model has no X1c.
                X2n: the sky model's facet grids: the predict cuts the model image into one complex64 grid per facet and degrid band and
                keeps them for the solve, but only for facets with model flux.  ndegrid = NChanSols (kMS.py sets Freq.NDegridBand from it);
                pad2_nz = dico_facet_stats(...)["pad2_nz"], the sum of NpixFacetPadded^2 over the facets with flux.  pad2_nz None omits X2n
                (the plan then under-predicts at large NPix; the caller says so).
                XS: an SSD DicoModel is a dense image (nterms x NPix x NPix) that the predict expands: [SSD] * NPix^2 * 1e-9 (npix None omits it).
                XW: the W-term kernels, cf_gb = cf_bytes(padded facet sizes, Cell, wmax, fmax) / 1e9, for every facet of the tessellation (all of
                them, flux or not): large for a low-declination field (large w) and wide facets (cf_gb None omits it: the plan then
                under-predicts at large w, ~6 GB on NGC 7541 at NPix 1225; the caller says so)."""
                c = model["kms"]["coefficients"]
                terms = {"a": c["a"]}
                if "X1c" in c:
                    if rows_chunk is None:
                        raise ValueError("kms_peak: this model's row term is per TChunk chunk (X1c): pass rows_chunk")
                    terms["X1c"] = c["X1c"] * rows_chunk * nchan * 8e-9
                else:
                    terms["X1"] = c["X1"] * rows_total * nchan * 8e-9
                if "X2n" in c and pad2_nz is not None and ndegrid is not None:
                    terms["X2n"] = c["X2n"] * ndegrid * pad2_nz * 8e-9
                if "XW" in c and cf_gb is not None:
                    terms["XW"] = c["XW"] * cf_gb
                if ssd:
                    if "XS" in c and npix is not None:
                        terms["XS"] = c["XS"] * npix ** 2 * 1e-9
                    if "model=SSD" in c:
                        terms["model=SSD"] = c["model=SSD"]
                return float(sum(terms.values())), terms


            def ddf_inputs_from_gd(GD, ms, mode=None):
                """Everything ddf_peak needs except the chunk length / ChanStep, from a GD and an MS summary."""
                beam = GD["Beam"]
                bm = beam.get("Model")
                beam_nband = 0 if (bm in (None, "None", "none", "")) else int(beam.get("NBand") or 0)
                return dict(nband=max(1, int(GD["Freq"]["NBand"])), nant=ms["nant"], beam_nband=beam_nband,
                            mode=mode or GD["Deconv"]["Mode"])


            def lowmem_options(model, GD=None, allow=False, steps=None):
                """The low-memory DDFacet option sets the planner may use, in the order it tries them: [(prefetch, psfpass, why), ...],
                always starting with the default (1, "joint", "default").  Empty beyond the default unless `allow` (the DDFacet in use
                accepts --Data-Prefetch / --Facets-PSFPass: DDFacet#145 / #146, DDFacet >= v0.16.16 in the pin) AND the model carries a
                NEGATIVE coefficient for the option (P0; PS with PL for PSFPass; fitted from the NGC 7541 A/B, section 13 of
                research/MEMORY_PLAN_CALIBRATION.md): without one the planner has no saving to count on.
                PSFPass separate is also not offered when DDFacet would fall back to joint (Comp.Sparsification > 1, Deconv.ApproximatePSF),
                when the GD's Facets.PSFOversize is not the one the model's PS / PL were measured at (or is unknown), or when none of
                `steps` grids the PSF (PSF_STEPS).
                Order: separate (no fidelity change, one more read of the data), then Prefetch 0 (slower I/O), then both."""
                sets = [(1, "joint", "default")]
                if not allow:
                    return sets
                c = model["ddf"]["coefficients"]
                sep = c.get("PS", 0.0) < 0 and "PL" in c
                if sep and GD is not None:
                    sp = (GD.get("Comp") or {}).get("Sparsification") or 0
                    try:
                        sp = max(float(x) for x in (sp if isinstance(sp, (list, tuple)) else [sp]))
                    except (TypeError, ValueError):
                        sp = 2                                          # unreadable: assume DDFacet falls back to joint
                    if sp > 1 or (GD.get("Deconv") or {}).get("ApproximatePSF"):
                        sep = False
                    if not psf_fit_applies(model, (GD.get("Facets") or {}).get("PSFOversize")):
                        sep = False
                elif sep:
                    sep = False                                         # no GD, no PSFOversize to check
                if sep and steps is not None and not any(st in PSF_STEPS for st in steps):
                    sep = False
                pf0 = c.get("P0", 0.0) < 0
                if sep:
                    sets.append((1, "separate", "PSFPass separate: PSF machine out of the first pass's peak"))
                if pf0:
                    sets.append((0, "joint", "Prefetch 0: one chunk's buffers fewer"))
                if sep and pf0:
                    sets.append((0, "separate", "PSFPass separate and Prefetch 0"))
                return sets


            def plan_ddf(model, GD, ms, ram_gb, margin=1.25, step="initial", mode=None,
                         chunk_choices=(4.0, 2.0, 1.0, 0.5), prefer="fidelity", chan_steps=(1, 2, 3, 4, 5, 6, 8, 10, 16, 20),
                         proxy_nodes=0, kms=None, allow_lowmem=False, degridgroup=None, psf_noprefetch=None):
                """Search ChunkHours x ChanStep for the largest ChunkHours whose predicted peak x margin fits ram_gb.

                step: target | initial | finalize | corrected, or "clustered" = the largest of initial / finalize / corrected
                (on the real profile corrected is the peak step, on the fast profile initial).  The corrected pass is
                tessellated with Facets.CatCentres if the GD has them (the others without), as the pipeline runs it.
                prefer 'fidelity' (default): the band stays whole while any chunk length fits at ChanStep 1; only if none
                does, ChanStep is raised to the smallest value at which one fits, and the largest chunk at that ChanStep is
                taken.  prefer 'speed': the largest chunk wins even if it costs band (the smallest ChanStep that fits that
                chunk is used).  Memory is flat in NCPU (phase 1), so NCPU is not part of the search.
                Returns (best or None, every combination tried, {step: (nfacets, sum pad^2)}); an entry is dict(chunk_hours,
                chan_step, nchan, rows_chunk, peak_gb, planned_gb, fits, limit_step, by_step).
                kms: None, or dict(ndegrid=NChanSols[, tchunk=--TChunk hours (default 0.5), dtmin=solution interval in minutes (default 5),
                rows_chunk, rows_total, nchan, wmax, fmax]) to also require the killMS solve to fit, at the smallest TChunk the stage-3 plan would fall
                back to (kms_tchunk_candidates; recorded as kms_tchunk in each entry): stage 3 halves TChunk until the solve fits.  The solve is a separate process that runs after the finalize clean, flat in DDFacet's ChunkHours / ChanStep
                (it reads its own --TChunk chunks of every channel), so it is one more entry of by_step ("kms") and, when it is the largest,
                the limit_step.  The facet term uses the sum of pad^2 over ALL facets of the finalize
                tessellation (CatCentres None, as the plan sees it at the solve): an upper bound of the flux-bearing facets the cab's own plan counts.
                The W-kernel term (XW) needs kms wmax (max |w|, m) and fmax (top channel, Hz); without them it is left out.
                allow_lowmem (default False): the DDFacet in use accepts --Data-Prefetch / --Facets-PSFPass (see lowmem_options).  False
                reproduces the plan of the version without these options exactly, and every entry says prefetch 1 / psfpass joint.  True:
                option sets (lowmem_options: default, PSFPass separate, Prefetch 0, both) enter the search.  Fidelity preference: the
                largest ChunkHours at the smallest ChanStep, and AT THAT CHUNK the first option set in that order that fits -- so the options are
                tried before ChunkHours is shrunk, and ChunkHours before ChanStep is raised.  Speed preference: the largest chunk, then
                the smallest ChanStep at it, then the first option set; the options only keep the largest chunk from costing band, they are not
                used to avoid a shrink of the chunk (the options cost wall time).  Each entry carries prefetch, psfpass, and lowmem_why.
                degridgroup: the --Facets-DegridGroup the step passes (None: the GD's own Facets.DegridGroup, i.e. the image's default, absent = 0);
                see degrid_group and ddf_peak.  Each entry carries degrid_group.
                psf_noprefetch: None = probe the DDFacet in use (psf_prefetch_off: PR #152, the PSF pass of PSFPass separate has no prefetch), or the
                value the step knows; each entry carries psf_prefetch_off."""
                import copy
                steps = CLUSTERED if step == "clustered" else (step,)
                geoms, pads_by = {}, {}
                for st in steps:
                    g = copy.deepcopy(GD)
                    if st != "corrected":
                        g["Facets"]["CatCentres"] = None
                    n, p2, pads = tessellate(g, ms["ra"], ms["dec"], proxy_nodes=proxy_nodes)
                    geoms[st] = (n, p2)
                    pads_by[st] = pads
                base = ddf_inputs_from_gd(GD, ms, mode=mode)
                sel = GD["Selection"]
                kms_gb = None
                kms_tchunk = None
                if kms is not None:
                    # the smallest TChunk stage 3 would fall back to (12.6): stage 3 halves TChunk until the solve fits, so stage 0 only has to
                    # know that SOME TChunk fits -- and its facet term charges every facet (no sky model yet), an upper bound
                    kms_tchunk = min(kms_tchunk_candidates(kms.get("tchunk", 0.5), kms.get("dtmin", 5.0)))
                    sk = "finalize" if "finalize" in geoms else max(geoms, key=lambda k: geoms[k][1])
                    gk = geoms[sk]
                    cf_gb = None
                    if kms.get("wmax") is not None and kms.get("fmax") is not None:
                        cf_gb = cf_bytes(pads_by[sk], GD["Image"]["Cell"], float(kms["wmax"]), float(kms["fmax"]), sup=GD["CF"]["Support"],
                                         nw=GD["CF"]["Nw"], overs=GD["CF"]["OverS"]) / 1e9
                    kms_gb = kms_peak(model, kms.get("rows_total", ms["nrows"]), kms.get("nchan", ms["nchan"]),
                                      ssd=str(base["mode"]).upper().startswith("SSD"), ndegrid=int(kms["ndegrid"]), pad2_nz=gk[1],
                                      npix=GD["Image"]["NPix"],
                                      rows_chunk=kms.get("rows_chunk", chunk_rows(ms["times"], kms_tchunk)),
                                      cf_gb=cf_gb)[0]
                option_sets = lowmem_options(model, GD, allow_lowmem, steps=steps)
                psf_os = (GD.get("Facets") or {}).get("PSFOversize")
                dgk = degrid_group(GD, degridgroup)
                ppo = psf_prefetch_off(psf_noprefetch)
                feasible, allp = [], []
                for cs in chan_steps:
                    nch = nchan_selected(ms["nchan"], sel.get("ChanStart"), sel.get("ChanEnd"), cs)
                    for ch in chunk_choices:
                        rows = chunk_rows(ms["times"], ch)
                        for rank, (pre, psf, why) in enumerate(option_sets):
                            per = {st: ddf_peak(model, geoms[st][1], geoms[st][0], rows_chunk=rows, nchan=nch, step=st,
                                                prefetch=pre, psfpass=psf, psf_oversize=psf_os,
                                                degrid_group=dgk, ndegrid=degrid_nbands(GD, nch), psf_prefetch_off=ppo, **base)[0]
                                   for st in steps}
                            if kms_gb is not None:
                                per["kms"] = kms_gb
                            lim = max(per, key=per.get)
                            peak = per[lim]
                            e = dict(chunk_hours=ch, chan_step=cs, nchan=nch, rows_chunk=rows, peak_gb=peak, kms_tchunk=kms_tchunk,
                                     planned_gb=peak * margin, fits=bool(peak * margin <= ram_gb), limit_step=lim,
                                     by_step={k: round(v, 3) for k, v in per.items()},
                                     prefetch=pre, psfpass=psf, lowmem_rank=rank, lowmem_why=why, degrid_group=dgk, psf_prefetch_off=ppo)
                            allp.append(e)
                            if e["fits"]:
                                feasible.append(e)
                if not feasible:
                    return None, allp, geoms
                if prefer == "speed":
                    best = max(feasible, key=lambda e: (e["chunk_hours"], -e["chan_step"], -e["lowmem_rank"]))
                else:
                    best = min(feasible, key=lambda e: (e["chan_step"], -e["chunk_hours"], e["lowmem_rank"]))
                return best, allp, geoms
            '''
